<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Play Instant Free HTML5 Games</title>

    <!-- Favicon 图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23111522'/><stop offset='100%' stop-color='%231a1c29'/></linearGradient></defs><circle cx='50' cy='50' r='48' fill='url(%23g)' stroke='%2300f2fe' stroke-width='3'/><circle cx='50' cy='50' r='38' fill='none' stroke='%23ff2a85' stroke-width='2' stroke-dasharray='4 2'/><text x='50%' y='68%' font-size='50' text-anchor='middle'>👆</text></svg>">

    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #1A1C29;
            --primary-cyan: #00f2fe;
            --primary-purple: #6C5CE7;
            --accent-pink: #ff2a85;
            --accent-glow: rgba(0, 242, 254, 0.35);
            --pink-glow: rgba(255, 42, 133, 0.4);
            --purple-glow: rgba(108, 92, 231, 0.4);
            --text-muted: #A0A5BA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 42, 133, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
            color: #ffffff; 
            padding: 20px; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        header.hero-brand-header { 
            text-align: center; 
            padding: 40px 20px 10px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lulutap-logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            position: relative;
            padding: 10px 32px;
            background: rgba(26, 28, 41, 0.7);
            border-radius: 100px;
            border: 1.5px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 35px rgba(255, 42, 133, 0.2), inset 0 0 20px rgba(0, 242, 254, 0.15);
            backdrop-filter: blur(16px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lulutap-logo-wrapper:hover {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.4);
            transform: translateY(-3px) scale(1.02);
        }

        .tap-circle-container {
            position: relative;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tap-hand-icon {
            font-size: 1.9rem;
            z-index: 2;
            transform: rotate(-15deg);
            filter: drop-shadow(0 0 10px var(--primary-cyan));
            animation: tapBounce 2s infinite ease-in-out;
        }

        .glow-pulse-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-cyan);
            animation: neonRingPulse 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            z-index: 1;
        }

        .brand-title-text {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1;
        }

        .brand-title-text .lulu-part {
            background: linear-gradient(135deg, #ff2a85 0%, #a742ff 50%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title-text .tap-part {
            background: linear-gradient(135deg, #ffffff 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle { 
            color: var(--text-muted); 
            font-size: 1.2rem; 
            margin-top: 18px;
            max-width: 750px;
        }

        .category-control-bar { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            flex-wrap: wrap; 
            margin: 32px 0 20px 0; 
        }

        .btn-home { 
            background: linear-gradient(135deg, var(--accent-pink), var(--primary-purple)); 
            color: #fff; border: none; padding: 10px 22px; 
            border-radius: 100px; font-weight: bold; cursor: pointer; 
            transition: all 0.3s; font-size: 14px; 
        }

        .btn-folder { 
            background-color: #1A1C29; color: var(--text-muted); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 10px 20px; border-radius: 100px; font-weight: 600; 
            cursor: pointer; transition: all 0.3s; font-size: 14px; 
        }
        .btn-folder:hover, .btn-folder.active { 
            background-color: #23263A; color: var(--primary-cyan); 
            border-color: var(--primary-cyan); 
        }

        .sub-category-panel { 
            max-width: 800px; margin: 0 auto 30px auto; display: none; 
            background: rgba(26, 28, 41, 0.9); border: 1px solid var(--primary-purple); 
            border-radius: 18px; padding: 18px; text-align: center; 
        }
        .sub-category-panel.open { display: block; }
        .sub-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        
        .sub-btn { 
            background-color: #121420; color: var(--text-muted); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 6px 16px; border-radius: 100px; cursor: pointer; font-size: 13px; 
        }
        .sub-btn.selected { 
            background: linear-gradient(135deg, var(--primary-cyan), #00b4d8); 
            color: #07090e; font-weight: bold; 
        }

        .marquee-wrapper {
            position: relative; width: 100%; overflow: hidden; margin: 20px 0 40px 0;
            mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
        }

        .marquee-track {
            display: flex; gap: 22px; width: max-content;
            animation: infiniteScroll 45s linear infinite;
        }
        .marquee-track:hover { animation-play-state: paused; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 22px; max-width: 1200px; margin: 10px auto 50px auto;
        }

        .card { 
            background-color: var(--card-bg); border-radius: 16px; overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.3s; 
            text-decoration: none; color: inherit; display: flex; flex-direction: column; 
            width: 220px; height: 320px; flex-shrink: 0;
        }
        .grid .card { width: 100%; }
        .card:hover { transform: translateY(-6px); border-color: var(--primary-cyan); }
        .card .card-img-wrapper { width: 100%; height: 175px; background: #121522; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 12px; color: #8A8F9E; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-cat { font-size: 11px; color: var(--primary-cyan); text-transform: uppercase; font-weight: bold; margin-top: 8px; }

        @keyframes infiniteScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes tapBounce { 0%, 100% { transform: rotate(-15deg) scale(1); } 50% { transform: rotate(-15deg) scale(0.88); } }
        @keyframes neonRingPulse { 0% { width: 18px; height: 18px; opacity: 1; } 100% { width: 65px; height: 65px; opacity: 0; } }

        .loading-text { text-align: center; font-size: 18px; color: var(--primary-cyan); margin: 50px 0; grid-column: 1/-1; }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <header class="hero-brand-header">
        <div class="lulutap-logo-wrapper" onclick="goHome()">
            <div class="tap-circle-container">
                <span class="tap-hand-icon">👆</span>
                <div class="glow-pulse-ring"></div>
            </div>
            <h1 class="brand-title-text"><span class="lulu-part">Lulu</span><span class="tap-part">Tap</span></h1>
        </div>
        <p class="subtitle">Tap into instant fun with hundreds of free HTML5 games! 🚀</p>
    </header>

    <div class="category-control-bar">
        <button class="btn-home" onclick="goHome()">🔥 All Games</button>
        <button class="btn-folder" onclick="openFolder('genres', event)">⚡ Genres ▾</button>
    </div>

    <div class="sub-category-panel" id="panel">
        <div class="sub-group" id="sub-genres">
            <button class="sub-btn" onclick="filterCategory('Action', this)">Action</button>
            <button class="sub-btn" onclick="filterCategory('Racing', this)">Racing</button>
            <button class="sub-btn" onclick="filterCategory('Driving', this)">Driving</button>
            <button class="sub-btn" onclick="filterCategory('Shooting', this)">Shooting</button>
            <button class="sub-btn" onclick="filterCategory('Puzzle', this)">Puzzle</button>
            <button class="sub-btn" onclick="filterCategory('Arcade', this)">Arcade</button>
            <button class="sub-btn" onclick="filterCategory('Casual', this)">Casual</button>
            <button class="sub-btn" onclick="filterCategory('Sports', this)">Sports</button>
            <button class="sub-btn" onclick="filterCategory('3D', this)">3D</button>
        </div>
    </div>

    <div class="marquee-wrapper" id="marquee-section">
        <div class="marquee-track" id="marquee-track"></div>
    </div>

    <div class="grid" id="game-grid">
        <div class="loading-text">🎮 Loading Games...</div>
    </div>

    <script>
        let allGames = [];

        // ✨ 从 GameMonetize Feed 接口自动拉取游戏列表 ✨
        // 使用 proxy 解决跨域 (CORS) 拦截
        const feedUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://gamemonetize.com/feed.php?format=0&page=1');

        fetch(feedUrl)
            .then(res => res.json())
            .then(data => {
                // 标准化数据格式
                allGames = data.map(item => ({
                    id: item.id,
                    title: item.title,
                    category: item.category,
                    description: item.description,
                    // 使用防盗链代理图片
                    cover: 'https://images.weserv.nl/?url=' + encodeURIComponent(item.thumb),
                    url: item.url
                }));

                renderGames(allGames);
                renderMarquee(allGames.slice(0, 10)); // 拿前10个放入跑马灯
            })
            .catch(err => {
                console.error('Feed error:', err);
                document.getElementById('game-grid').innerHTML = '<p class="loading-text" style="color:#ff2a85;">Failed to load games. Please refresh.</p>';
            });

        function createCardElement(game) {
            const a = document.createElement('a');
            a.className = 'card';
            // 点击直接跳转游戏大屏
            a.href = game.url;
            a.target = '_blank';
            a.innerHTML = `
                <div class="card-img-wrapper">
                    <img src="${game.cover}" alt="${game.title}" loading="lazy">
                </div>
                <div class="card-info">
                    <div>
                        <div class="card-title">${game.title}</div>
                        <div class="card-desc">${game.description || ''}</div>
                    </div>
                    <div class="card-cat">${game.category || 'Game'}</div>
                </div>
            `;
            return a;
        }

        function renderMarquee(list) {
            const track = document.getElementById('marquee-track');
            track.innerHTML = '';
            list.concat(list).forEach(game => track.appendChild(createCardElement(game)));
        }

        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = '<p class="loading-text">No games found.</p>';
                return;
            }
            list.forEach(game => grid.appendChild(createCardElement(game)));
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            const filtered = allGames.filter(g => g.category.toLowerCase().includes(cat.toLowerCase()));
            renderGames(filtered);
        }

        function openFolder(name, e) {
            const panel = document.getElementById('panel');
            panel.classList.toggle('open');
        }

        function goHome() {
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('panel').classList.remove('open');
            renderGames(allGames);
        }
    </script>
</body>
</html>
