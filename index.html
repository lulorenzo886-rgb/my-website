<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Play Instant Free HTML5 Games</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #1A1C29;
            --primary-cyan: #00f2fe;
            --primary-purple: #6C5CE7;
            --accent-pink: #ff2a85;
            --text-muted: #A0A5BA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            color: #ffffff; padding: 20px; min-height: 100vh;
        }

        header { text-align: center; padding: 20px 0; }
        .logo { font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #ff2a85, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 分类控制栏 */
        .category-bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        .btn-tag { 
            background: #1A1C29; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s;
        }
        .btn-tag:hover { border-color: var(--primary-cyan); color: #fff; }
        .btn-tag.active { background: linear-gradient(135deg, var(--primary-cyan), #00b4d8); color: #000; font-weight: bold; border-color: transparent; }
        
        .btn-reset { background: var(--accent-pink); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* 已选标签显示区 */
        .selected-bar { max-width: 800px; margin: 0 auto 20px; text-align: center; font-size: 13px; color: var(--text-muted); }
        .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--primary-purple); color: #fff; padding: 4px 10px; border-radius: 12px; margin: 2px; font-weight: bold; }
        .chip span { cursor: pointer; margin-left: 4px; }

        /* 游戏网格 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            text-decoration: none; color: inherit; transition: transform 0.2s; 
            border: 1px solid rgba(255,255,255,0.05); position: relative;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary-cyan); }
        
        /* 封面图容器 */
        .card-img-wrapper { position: relative; width: 100%; height: 160px; background: #121522; }
        .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* ✨ 右上角设备角标样式 ✨ */
        .device-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(7, 9, 14, 0.75);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 3px 6px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .card-info { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-cat { font-size: 11px; color: var(--primary-cyan); text-transform: uppercase; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">👆 LuluTap</h1>
        <p style="color:var(--text-muted); margin-top:5px;">Instant Free HTML5 Games for PC & Mobile 🚀</p>
    </header>

    <!-- 标签选择栏 -->
    <div class="category-bar">
        <button class="btn-reset" onclick="resetFilters()">🔥 Reset All</button>
        <button class="btn-tag" data-tag="Action" onclick="toggleTag('Action', this)">Action</button>
        <button class="btn-tag" data-tag="Racing" onclick="toggleTag('Racing', this)">Racing</button>
        <button class="btn-tag" data-tag="Shooting" onclick="toggleTag('Shooting', this)">Shooting</button>
        <button class="btn-tag" data-tag="Puzzle" onclick="toggleTag('Puzzle', this)">Puzzle</button>
        <button class="btn-tag" data-tag="Arcade" onclick="toggleTag('Arcade', this)">Arcade</button>
        <button class="btn-tag" data-tag="Casual" onclick="toggleTag('Casual', this)">Casual</button>
        <button class="btn-tag" data-tag="3D" onclick="toggleTag('3D', this)">3D</button>
        <button class="btn-tag" data-tag="Girls" onclick="toggleTag('Girls', this)">Girls</button>
        <button class="btn-tag" data-tag="Boys" onclick="toggleTag('Boys', this)">Boys</button>
    </div>

    <!-- 已选标签区 -->
    <div class="selected-bar" id="selected-bar" style="display: none;">
        Active Filters: <span id="chip-container"></span>
    </div>

    <div class="grid" id="game-grid">
        <p style="text-align:center; grid-column:1/-1; color:var(--primary-cyan);">Loading games...</p>
    </div>

    <script>
        let allGames = [];
        let activeTags = new Set();

        const feedUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://gamemonetize.com/feed.php?format=0&page=1');

        fetch(feedUrl)
            .then(res => res.json())
            .then(data => {
                allGames = data.map(item => ({
                    id: item.id,
                    title: item.title,
                    categories: item.category ? item.category.toLowerCase().split(/[\s,/]+/) : [],
                    rawCategory: item.category,
                    cover: 'https://images.weserv.nl/?url=' + encodeURIComponent(item.thumb),
                    url: item.url,
                    // HTML5 游戏基本都兼顾 PC 和 Mobile，这里可以统一标注，或者根据规则自定义
                    isMobile: true,
                    isPC: true
                }));
                renderGames(allGames);
            });

        function toggleTag(tag, btn) {
            const tagLower = tag.toLowerCase();
            if (activeTags.has(tagLower)) {
                activeTags.delete(tagLower);
                btn.classList.remove('active');
            } else {
                activeTags.add(tagLower);
                btn.classList.add('active');
            }
            applyFilters();
        }

        function removeSingleTag(tagLower) {
            activeTags.delete(tagLower);
            const btn = Array.from(document.querySelectorAll('.btn-tag')).find(b => b.dataset.tag.toLowerCase() === tagLower);
            if(btn) btn.classList.remove('active');
            applyFilters();
        }

        function resetFilters() {
            activeTags.clear();
            document.querySelectorAll('.btn-tag').forEach(b => b.classList.remove('active'));
            applyFilters();
        }

        function applyFilters() {
            const bar = document.getElementById('selected-bar');
            const container = document.getElementById('chip-container');
            
            if (activeTags.size === 0) {
                bar.style.display = 'none';
                renderGames(allGames);
                return;
            }

            bar.style.display = 'block';
            container.innerHTML = Array.from(activeTags).map(t => 
                `<span class="chip">${t.toUpperCase()} <span onclick="removeSingleTag('${t}')">✕</span></span>`
            ).join('');

            const filtered = allGames.filter(game => {
                return Array.from(activeTags).every(tag => game.categories.includes(tag));
            });

            renderGames(filtered);
        }

        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-muted); padding:40px 0;">No games found.</p>';
                return;
            }

            list.forEach(game => {
                const a = document.createElement('a');
                a.className = 'card';
                a.href = game.url;
                a.target = '_blank';
                
                // 根据游戏属性决定是否渲染 PC/Mobile 标记（默认二者皆支持）
                const deviceBadges = `
                    <div class="device-badge" title="Supported Devices">
                        ${game.isPC ? '💻' : ''} ${game.isMobile ? '📱' : ''}
                    </div>
                `;

                a.innerHTML = `
                    <div class="card-img-wrapper">
                        ${deviceBadges}
                        <img src="${game.cover}" alt="${game.title}" loading="lazy">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${game.title}</div>
                        <div class="card-cat">${game.rawCategory || 'Game'}</div>
                    </div>
                `;
                grid.appendChild(a);
            });
        }
    </script>
</body>
</html>
