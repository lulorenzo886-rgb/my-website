<!-- 核心交互 JS 逻辑（容错与全量兼容增强版） -->
    <script>
        let allGames = [];
        let activeFolderName = null;
        let selectedTags = new Map();
        let searchQuery = "";

        // 读取游戏数据（加上随机数防止浏览器强缓存）
        fetch('static/games.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(games => {
                allGames = games;
                console.log("成功加载游戏总数：", allGames.length); // 你可以在浏览器 F12 控制台打印看数量
                renderGames(allGames);
            })
            .catch(err => {
                console.error('Error loading games:', err);
                document.getElementById('game-grid').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#ff5555;padding:40px 0;">Failed to load static/games.json file.</p>';
            });

        // 展开 / 折叠集合面板
        function openFolder(folderName, e) {
            const panel = document.getElementById('panel');
            document.querySelectorAll('.btn-folder').forEach(btn => btn.classList.remove('active'));

            if (activeFolderName === folderName && panel.classList.contains('open')) {
                panel.classList.remove('open');
                activeFolderName = null;
                return;
            }

            if (e && e.currentTarget) {
                e.currentTarget.classList.add('active');
            }

            document.querySelectorAll('.sub-group').forEach(g => g.style.display = 'none');
            document.getElementById('sub-' + folderName).style.display = 'flex';
            
            panel.classList.add('open');
            activeFolderName = folderName;
        }

        // 点击 Show All / 重置
        function goHome() {
            document.querySelectorAll('.btn-folder').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('selected'));
            
            selectedTags.clear();
            searchQuery = "";
            document.getElementById('search-input').value = "";
            updateSelectedTagsUI();

            document.getElementById('panel').classList.remove('open');
            activeFolderName = null;
            
            renderGames(allGames);
        }

        // 选择 / 取消选择标签
        function toggleTag(cat, btnElement) {
            const catLower = cat.toLowerCase();
            const displayName = btnElement.textContent.trim();

            if (selectedTags.has(catLower)) {
                selectedTags.delete(catLower);
                btnElement.classList.remove('selected');
            } else {
                selectedTags.set(catLower, displayName);
                btnElement.classList.add('selected');
            }

            updateSelectedTagsUI();
            applyFilters();
        }

        // 移除顶部的 Chip 标签
        function removeTag(catLower) {
            selectedTags.delete(catLower);
            document.querySelectorAll(`.sub-btn[data-cat="${catLower}"]`).forEach(btn => {
                btn.classList.remove('selected');
            });

            updateSelectedTagsUI();
            applyFilters();
        }

        // 刷新顶部已选 Chip UI
        function updateSelectedTagsUI() {
            const bar = document.getElementById('selected-tags-bar');
            const listContainer = document.getElementById('selected-tags-list');

            if (selectedTags.size === 0) {
                bar.classList.remove('active');
                listContainer.innerHTML = '';
            } else {
                bar.classList.add('active');
                let html = '';
                selectedTags.forEach((displayName, keyLower) => {
                    html += `
                        <span class="selected-chip">
                            ${displayName}
                            <span class="btn-close-chip" onclick="removeTag('${keyLower}')">✕</span>
                        </span>
                    `;
                });
                listContainer.innerHTML = html;
            }
        }

        // 搜索框输入
        function onSearchInput(val) {
            searchQuery = val.trim().toLowerCase();
            applyFilters();
        }

        // 过滤逻辑（超强兼容版：同时兼容 category / categories 字段，支持大小写与模糊匹配）
        function applyFilters() {
            const requiredKeys = Array.from(selectedTags.keys());

            const filtered = allGames.filter(game => {
                // 1. 提取该游戏的所有分类标签（兼容单数 category 与复数 categories 字段）
                let rawCats = game.category || game.categories || [];
                if (typeof rawCats === 'string') {
                    rawCats = rawCats.split(',').map(s => s.trim());
                }
                const gameCategories = rawCats.map(c => String(c).toLowerCase());

                // 2. 标签匹配 (确保所选标签都能在游戏标签中找到)
                const matchesTags = requiredKeys.every(tagKey => {
                    return gameCategories.some(gc => gc.includes(tagKey) || tagKey.includes(gc));
                });
                
                // 3. 搜索框匹配
                const title = String(game.title || '').toLowerCase();
                const desc = String(game.description || '').toLowerCase();
                const matchesSearch = !searchQuery || title.includes(searchQuery) || desc.includes(searchQuery);

                return matchesTags && matchesSearch;
            });

            renderGames(filtered);
        }

        // 渲染卡片
        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:60px 0;">No games match your selected filters.</p>';
                return;
            }

            list.forEach(game => {
                const gameId = game.id || game.slug;
                const coverImg = game.cover || game.image || 'https://via.placeholder.com/512';
                
                let rawCats = game.category || game.categories || [];
                if (typeof rawCats === 'string') rawCats = [rawCats];
                const catText = rawCats.slice(0, 2).join(' • ');

                const div = document.createElement('div');
                div.className = 'game-card';
                div.innerHTML = `
                    <a href="game.html?id=${gameId}" class="card-link">
                        <div class="image-wrapper">
                            <img src="${coverImg}" alt="${game.title || 'Game'}" onerror="this.src='https://via.placeholder.com/512?text=Game'">
                        </div>
                        <div class="card-meta">
                            <div class="cat-label">${catText || 'GAME'}</div>
                            <div class="card-title">${game.title || 'Untitled Game'}</div>
                            <div class="card-author">${game.description || ''}</div>
                        </div>
                    </a>
                `;
                grid.appendChild(div);
            });
        }
    </script>
