<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Play Instant Free HTML5 Games</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #1A1C29;
            --primary-cyan: #00f2fe;
            --primary-purple: #6C5CE7;
            --accent-glow: rgba(0, 242, 254, 0.35);
            --purple-glow: rgba(108, 92, 231, 0.4);
            --text-muted: #A0A5BA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark); 
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(108, 92, 231, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
            color: #ffffff; 
            padding: 20px; 
            min-height: 100vh;
        }

        /* =========================================================
           1. 顶部 Header / 炫酷 Logo 区域 (蓝框重构)
           ========================================================= */
        header.hero-brand-header { 
            text-align: center; 
            padding: 45px 20px 10px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lulutap-logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            position: relative;
            padding: 12px 28px;
            background: rgba(26, 28, 41, 0.65);
            border-radius: 100px;
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15), inset 0 0 15px rgba(108, 92, 231, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .lulutap-logo-wrapper:hover {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.35), inset 0 0 25px rgba(108, 92, 231, 0.4);
            transform: translateY(-2px);
        }

        /* 手指 Icon 与包围光圈 */
        .tap-circle-container {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tap-hand-icon {
            font-size: 1.8rem;
            z-index: 2;
            transform: rotate(-15deg);
            filter: drop-shadow(0 0 8px var(--primary-cyan));
            animation: tapBounce 2s infinite ease-in-out;
        }

        /* 以手指指尖为中心的扩散脉冲霓虹圈 */
        .glow-pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-cyan);
            box-shadow: 0 0 15px var(--primary-cyan), inset 0 0 10px var(--primary-purple);
            animation: neonRingPulse 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            z-index: 1;
        }

        .brand-title-text {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 0%, var(--primary-cyan) 50%, var(--primary-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 242, 254, 0.3);
            line-height: 1;
            margin: 0;
        }

        p.subtitle { 
            color: var(--text-muted); 
            font-size: 0.9rem; 
            margin-top: 14px;
            letter-spacing: 0.3px;
        }

        /* =========================================================
           2. 分类控制栏 (紫框部分 - 整体下移)
           ========================================================= */
        .category-control-bar { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            flex-wrap: wrap; 
            margin-top: 30px;    /* 👈 整体下移 */
            margin-bottom: 20px; 
        }

        .btn-home { 
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-cyan)); 
            color: #ffffff; 
            border: none; 
            padding: 10px 22px; 
            border-radius: 100px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            font-size: 14px; 
            box-shadow: 0 4px 15px var(--purple-glow);
        }
        .btn-home:hover { 
            transform: translateY(-2px) scale(1.03); 
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-folder { 
            background-color: #1A1C29; 
            color: var(--text-muted); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 10px 20px; 
            border-radius: 100px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .btn-folder:hover, .btn-folder.active { 
            background-color: #23263A; 
            color: var(--primary-cyan); 
            border-color: var(--primary-cyan); 
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* 顶部已选 Filter 胶囊条 */
        .selected-tags-bar { 
            max-width: 800px; 
            margin: 0 auto 20px auto; 
            display: none; 
            text-align: center; 
            font-size: 13px; 
            color: var(--text-muted); 
            background: rgba(26, 28, 41, 0.8); 
            padding: 10px 18px; 
            border-radius: 100px; 
            border: 1px dashed var(--primary-purple); 
            backdrop-filter: blur(10px);
        }
        .selected-tags-bar.active { display: block; animation: fadeIn 0.3s ease; }
        .selected-tags-wrapper { display: inline-flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-left: 8px; }
        
        .selected-chip { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            background: linear-gradient(135deg, var(--primary-purple), #5a4bcf); 
            color: #ffffff; 
            padding: 5px 14px; 
            border-radius: 100px; 
            font-size: 13px; 
            font-weight: bold; 
            box-shadow: 0 2px 10px var(--purple-glow);
        }
        .btn-close-chip { 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: bold; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 50%; 
            width: 16px; 
            height: 16px; 
            background: rgba(0, 0, 0, 0.3); 
            transition: all 0.2s;
        }
        .btn-close-chip:hover { background: #ff4757; transform: scale(1.15); }

        /* 弹出的子分类面板 */
        .sub-category-panel { 
            max-width: 800px; 
            margin: 0 auto 30px auto; 
            display: none; 
            background: rgba(26, 28, 41, 0.9); 
            border: 1px solid var(--primary-purple); 
            border-radius: 18px; 
            padding: 18px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 20px var(--purple-glow); 
            backdrop-filter: blur(12px);
        }
        .sub-category-panel.open { display: block; animation: slideDown 0.25s ease-out; }
        
        .sub-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        
        .sub-btn { 
            background-color: #121420; 
            color: var(--text-muted); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 6px 16px; 
            border-radius: 100px; 
            cursor: pointer; 
            transition: all 0.2s; 
            font-size: 13px; 
            user-select: none; 
        }
        .sub-btn:hover { border-color: var(--primary-cyan); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }
        .sub-btn.selected { 
            background: linear-gradient(135deg, var(--primary-cyan), #00b4d8); 
            color: #07090e; 
            border-color: transparent; 
            font-weight: bold; 
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* =========================================================
           3. 游戏网格区域 (绿框部分 - 整体下移)
           ========================================================= */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 22px; 
            max-width: 1200px; 
            margin: 10px auto 50px auto; /* 👈 整体下移并拉开底部空间 */
        }
        .card { 
            background-color: var(--card-bg); 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            text-decoration: none; 
            color: inherit; 
            display: flex; 
            flex-direction: column; 
        }
        .card:hover { 
            transform: translateY(-6px); 
            border-color: var(--primary-cyan); 
            box-shadow: 0 10px 25px -5px var(--accent-glow);
        }
        .card img { width: 100%; height: 175px; object-fit: cover; background-color: #181d2d; }
        .card-info { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #fff; }
        .card-desc { font-size: 12px; color: #8A8F9E; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .card-cat { font-size: 11px; color: var(--primary-cyan); text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }

        /* Keyframe 动画 */
        @keyframes tapBounce {
            0%, 100% { transform: rotate(-15deg) scale(1) translateY(0); }
            50% { transform: rotate(-15deg) scale(0.88) translateY(3px); }
        }

        @keyframes neonRingPulse {
            0% {
                width: 18px;
                height: 18px;
                opacity: 1;
                border-color: var(--primary-cyan);
                box-shadow: 0 0 10px var(--primary-cyan);
            }
            50% {
                width: 48px;
                height: 48px;
                opacity: 0.8;
                border-color: var(--primary-purple);
                box-shadow: 0 0 20px var(--primary-purple);
            }
            100% {
                width: 65px;
                height: 65px;
                opacity: 0;
                border-color: var(--primary-cyan);
            }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 蓝框重构：Logo + 科技圆圈手势 -->
    <header class="hero-brand-header">
        <div class="lulutap-logo-wrapper" onclick="goHome(event)">
            <div class="tap-circle-container">
                <span class="tap-hand-icon">👆</span>
                <div class="glow-pulse-ring"></div>
            </div>
            <h1 class="brand-title-text">LuluTap</h1>
        </div>
        <p class="subtitle">Play free online HTML5 games directly in your browser with no downloads required!</p>
    </header>

    <!-- 紫框部分：顶部控制栏 (已下移) -->
    <div class="category-control-bar">
        <button class="btn-home" onclick="goHome(event)">🔥 Show All Games</button>
        <button class="btn-folder" onclick="openFolder('players', event)">👥 Players ▾</button>
        <button class="btn-folder" onclick="openFolder('genres', event)">⚡ Genres ▾</button>
        <button class="btn-folder" onclick="openFolder('styles', event)">🎨 Styles ▾</button>
        <button class="btn-folder" onclick="openFolder('tags', event)">🎯 Tags ▾</button>
    </div>

    <!-- 顶部的已选择标签展示条 -->
    <div class="selected-tags-bar" id="selected-tags-bar">
        Selected Filters: <div class="selected-tags-wrapper" id="selected-tags-list"></div>
    </div>

    <!-- 弹出的具体小分类面板 -->
    <div class="sub-category-panel" id="panel">
        
        <!-- 👥 Players 子分类 -->
        <div class="sub-group" id="sub-players" style="display:none;">
            <button class="sub-btn" data-cat="2player" onclick="toggleTag('2player', this)">2 Player</button>
            <button class="sub-btn" data-cat="singleplayer" onclick="toggleTag('singleplayer', this)">Single Player</button>
            <button class="sub-btn" data-cat="multiplayer" onclick="toggleTag('multiplayer', this)">Multiplayer</button>
            <button class="sub-btn" data-cat="boys" onclick="toggleTag('boys', this)">Boys</button>
            <button class="sub-btn" data-cat="girls" onclick="toggleTag('girls', this)">Girls</button>
            <button class="sub-btn" data-cat="kids" onclick="toggleTag('kids', this)">Kids</button>
        </div>

        <!-- ⚡ Genres 子分类 -->
        <div class="sub-group" id="sub-genres" style="display:none;">
            <button class="sub-btn" data-cat="action" onclick="toggleTag('action', this)">Action</button>
            <button class="sub-btn" data-cat="racing" onclick="toggleTag('racing', this)">Racing</button>
            <button class="sub-btn" data-cat="driving" onclick="toggleTag('driving', this)">Driving</button>
            <button class="sub-btn" data-cat="shooting" onclick="toggleTag('shooting', this)">Shooting</button>
            <button class="sub-btn" data-cat="puzzle" onclick="toggleTag('puzzle', this)">Puzzle</button>
            <button class="sub-btn" data-cat="arcade" onclick="toggleTag('arcade', this)">Arcade</button>
            <button class="sub-btn" data-cat="casual" onclick="toggleTag('casual', this)">Casual</button>
            <button class="sub-btn" data-cat="sports" onclick="toggleTag('sports', this)">Sports</button>
            <button class="sub-btn" data-cat="adventure" onclick="toggleTag('adventure', this)">Adventure</button>
            <button class="sub-btn" data-cat="simulation" onclick="toggleTag('simulation', this)">Simulation</button>
        </div>

        <!-- 🎨 Styles 子分类 -->
        <div class="sub-group" id="sub-styles" style="display:none;">
            <button class="sub-btn" data-cat="3d" onclick="toggleTag('3d', this)">3D</button>
            <button class="sub-btn" data-cat="2d" onclick="toggleTag('2d', this)">2D</button>
            <button class="sub-btn" data-cat="pixel" onclick="toggleTag('pixel', this)">Pixel</button>
            <button class="sub-btn" data-cat="io" onclick="toggleTag('io', this)">.IO Games</button>
        </div>

        <!-- 🎯 Tags 子分类 -->
        <div class="sub-group" id="sub-tags" style="display:none;">
            <button class="sub-btn" data-cat="car" onclick="toggleTag('car', this)">Car</button>
            <button class="sub-btn" data-cat="bike" onclick="toggleTag('bike', this)">Bike</button>
            <button class="sub-btn" data-cat="dressup" onclick="toggleTag('dressup', this)">Dress Up</button>
            <button class="sub-btn" data-cat="cooking" onclick="toggleTag('cooking', this)">Cooking</button>
            <button class="sub-btn" data-cat="runner" onclick="toggleTag('runner', this)">Runner</button>
            <button class="sub-btn" data-cat="clicker" onclick="toggleTag('clicker', this)">Clicker</button>
            <button class="sub-btn" data-cat="zombie" onclick="toggleTag('zombie', this)">Zombie</button>
        </div>

    </div>

    <!-- 绿框部分：游戏面板 (已下移) -->
    <div class="grid" id="game-grid"></div>

    <script>
        let allGames = [];
        let activeFolderName = null;
        let selectedTags = new Map();

        fetch('static/games.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(games => {
                allGames = games;
                renderGames(allGames);
            })
            .catch(err => {
                console.error('Error loading games:', err);
                document.getElementById('game-grid').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#ff5555;">Failed to load games. Please check static/games.json file.</p>';
            });

        function openFolder(folderName, e) {
            const panel = document.getElementById('panel');
            document.querySelectorAll('.btn-folder').forEach(btn => btn.classList.remove('active'));

            if (activeFolderName === folderName && panel.classList.contains('open')) {
                panel.classList.remove('open');
                activeFolderName = null;
                return;
            }

            if (e && e.currentTarget) {
                e.currentTarget.classList.add('active');
            }

            document.querySelectorAll('.sub-group').forEach(g => g.style.display = 'none');
            document.getElementById('sub-' + folderName).style.display = 'flex';
            
            panel.classList.add('open');
            activeFolderName = folderName;
        }

        function goHome(e) {
            document.querySelectorAll('.btn-folder').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('selected'));
            
            selectedTags.clear();
            updateSelectedTagsUI();

            document.getElementById('panel').classList.remove('open');
            activeFolderName = null;
            
            renderGames(allGames);
        }

        function toggleTag(cat, btnElement) {
            const catLower = cat.toLowerCase();
            const displayName = btnElement.textContent.trim();

            if (selectedTags.has(catLower)) {
                selectedTags.delete(catLower);
                btnElement.classList.remove('selected');
            } else {
                selectedTags.set(catLower, displayName);
                btnElement.classList.add('selected');
            }

            updateSelectedTagsUI();
            applyMultiFilter();
        }

        function removeTag(catLower) {
            selectedTags.delete(catLower);
            
            document.querySelectorAll(`.sub-btn[data-cat="${catLower}"]`).forEach(btn => {
                btn.classList.remove('selected');
            });

            updateSelectedTagsUI();
            applyMultiFilter();
        }

        function updateSelectedTagsUI() {
            const bar = document.getElementById('selected-tags-bar');
            const listContainer = document.getElementById('selected-tags-list');

            if (selectedTags.size === 0) {
                bar.classList.remove('active');
                listContainer.innerHTML = '';
            } else {
                bar.classList.add('active');
                let html = '';
                selectedTags.forEach((displayName, keyLower) => {
                    html += `
                        <span class="selected-chip">
                            ${displayName}
                            <span class="btn-close-chip" onclick="removeTag('${keyLower}')">✕</span>
                        </span>
                    `;
                });
                listContainer.innerHTML = html;
            }
        }

        function applyMultiFilter() {
            if (selectedTags.size === 0) {
                renderGames(allGames);
                return;
            }

            const requiredKeys = Array.from(selectedTags.keys());

            const filtered = allGames.filter(game => {
                let gameCategories = [];
                if (Array.isArray(game.category)) {
                    gameCategories = game.category.map(c => c.toLowerCase());
                } else if (typeof game.category === 'string') {
                    gameCategories = [game.category.toLowerCase()];
                }

                return requiredKeys.every(tagKey => gameCategories.includes(tagKey));
            });

            renderGames(filtered);
        }

        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#8A8F9E;padding:40px 0;">No games match all selected tags. Try removing some filters by clicking ✕!</p>';
                return;
            }

            list.forEach(game => {
                const gameId = game.id || game.slug;
                const coverImg = game.cover || game.image || 'https://via.placeholder.com/512';
                
                let categories = [];
                if (Array.isArray(game.category)) {
                    categories = game.category;
                } else if (typeof game.category === 'string') {
                    categories = [game.category];
                }
                const catText = categories.join(' • ').toUpperCase();

                const a = document.createElement('a');
                a.className = 'card';
                a.href = `game.html?id=${gameId}`;
                a.innerHTML = `
                    <img src="${coverImg}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/512?text=Game+Cover'">
                    <div class="card-info">
                        <div>
                            <div class="card-title">${game.title}</div>
                            <div class="card-desc">${game.description || ''}</div>
                        </div>
                        <div class="card-cat">${catText}</div>
                    </div>
                `;
                grid.appendChild(a);
            });
        }
    </script>
</body>
</html>
