<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Game Station - Play Free Games</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: #111522;
            --primary-cyan: #00f2fe;
            --primary-purple: #4facfe;
            --neon-glow: rgba(0, 242, 254, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航栏 */
        .glass-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 32px;
            background: rgba(17, 21, 34, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #000;
            font-size: 1.2rem;
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .brand-name .highlight {
            color: var(--primary-cyan);
        }

        .search-capsule {
            display: flex;
            align-items: center;
            background: #181d2d;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            padding: 8px 18px;
            width: 380px;
        }

        .search-capsule input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
        }

        .action-btn {
            color: var(--primary-cyan);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 顶部控制栏 (包含首页按钮 + 4个大集合) */
        .category-control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px 32px 10px;
        }

        /* 绿色/首页主按钮 */
        .btn-home {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 100px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--neon-glow);
        }

        .btn-home:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
        }

        /* 4 个集合大按钮 */
        .btn-folder {
            background: #121724;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn-folder:hover {
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            transform: translateY(-2px);
        }

        .btn-folder.active {
            background: rgba(0, 242, 254, 0.1);
            border-color: var(--primary-cyan);
            color: var(--primary-cyan);
            box-shadow: 0 0 20px var(--neon-glow);
            font-weight: 700;
        }

        /* 已选标签置顶栏 (带有 ✕ 的 Chip 胶囊) */
        .selected-tags-bar {
            max-width: 900px;
            margin: 0 auto 16px auto;
            display: none;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(17, 21, 34, 0.6);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px dashed rgba(0, 242, 254, 0.3);
        }

        .selected-tags-bar.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .selected-tags-wrapper {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
        }

        .selected-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            color: #000;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 800;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-close-chip {
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            transition: all 0.2s ease;
        }

        .btn-close-chip:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            transform: scale(1.15) rotate(90deg);
        }

        /* 二级分类弹出面板 (毛玻璃悬浮框) */
        .sub-category-panel {
            max-width: 900px;
            margin: 0 auto 24px auto;
            display: none;
            background: rgba(17, 21, 34, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 242, 254, 0.15);
        }

        .sub-category-panel.open {
            display: block;
            animation: slideDown3D 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sub-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .sub-btn {
            background: #121724;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 7px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .sub-btn:hover {
            color: #fff;
            border-color: var(--primary-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .sub-btn.selected {
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-purple));
            color: #000;
            border-color: transparent;
            font-weight: 800;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        /* 主体与游戏卡片网格 */
        .main-content {
            flex: 1;
            padding: 0 32px 40px;
        }

        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .card-meta {
            padding: 12px 16px;
        }

        .cat-label {
            font-size: 0.7rem;
            color: var(--primary-cyan);
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 2px;
            color: #fff;
        }

        .card-author {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary-cyan);
            box-shadow: 0 10px 25px -5px var(--neon-glow);
        }

        .game-card:hover .image-wrapper img {
            transform: scale(1.05);
        }

        /* 页脚 */
        .arcade-footer {
            background: #0b0e17;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 15px;
        }

        .footer-links a:hover {
            color: var(--primary-cyan);
        }

        /* 动画 */
        @keyframes slideDown3D {
            from {
                opacity: 0;
                transform: translateY(-15px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <nav class="glass-navbar">
        <div class="nav-brand">
            <div class="brand-logo">🎮</div>
            <div class="brand-name">INSTANT<span class="highlight">GAMES</span></div>
        </div>
        <div class="search-capsule">
            <input type="text" id="search-input" placeholder="Search games..." oninput="onSearchInput(this.value)">
        </div>
        <a href="#" class="action-btn">Featured</a>
    </nav>

    <!-- 分类控制栏 -->
    <div class="category-control-bar">
        <button class="btn-home" onclick="goHome()">🔥 Show All Games</button>
        <button class="btn-folder" onclick="openFolder('players', event)">👥 Players ▾</button>
        <button class="btn-folder" onclick="openFolder('genres', event)">⚡ Genres ▾</button>
        <button class="btn-folder" onclick="openFolder('styles', event)">🎨 Styles ▾</button>
        <button class="btn-folder" onclick="openFolder('tags', event)">🎯 Tags ▾</button>
    </div>

    <!-- 置顶已选多标签栏 -->
    <div class="selected-tags-bar" id="selected-tags-bar">
        Selected Filters: <div class="selected-tags-wrapper" id="selected-tags-list"></div>
    </div>

    <!-- 弹出式二级分类面板 -->
    <div class="sub-category-panel" id="panel">
        <div class="sub-group" id="sub-players" style="display:none;">
            <button class="sub-btn" data-cat="2player" onclick="toggleTag('2player', this)">2 Player</button>
            <button class="sub-btn" data-cat="singleplayer" onclick="toggleTag('singleplayer', this)">Single Player</button>
            <button class="sub-btn" data-cat="multiplayer" onclick="toggleTag('multiplayer', this)">Multiplayer</button>
            <button class="sub-btn" data-cat="boys" onclick="toggleTag('boys', this)">Boys</button>
            <button class="sub-btn" data-cat="girls" onclick="toggleTag('girls', this)">Girls</button>
            <button class="sub-btn" data-cat="kids" onclick="toggleTag('kids', this)">Kids</button>
        </div>

        <div class="sub-group" id="sub-genres" style="display:none;">
            <button class="sub-btn" data-cat="action" onclick="toggleTag('action', this)">Action</button>
            <button class="sub-btn" data-cat="racing" onclick="toggleTag('racing', this)">Racing</button>
            <button class="sub-btn" data-cat="driving" onclick="toggleTag('driving', this)">Driving</button>
            <button class="sub-btn" data-cat="shooting" onclick="toggleTag('shooting', this)">Shooting</button>
            <button class="sub-btn" data-cat="puzzle" onclick="toggleTag('puzzle', this)">Puzzle</button>
            <button class="sub-btn" data-cat="arcade" onclick="toggleTag('arcade', this)">Arcade</button>
            <button class="sub-btn" data-cat="casual" onclick="toggleTag('casual', this)">Casual</button>
            <button class="sub-btn" data-cat="sports" onclick="toggleTag('sports', this)">Sports</button>
            <button class="sub-btn" data-cat="adventure" onclick="toggleTag('adventure', this)">Adventure</button>
            <button class="sub-btn" data-cat="simulation" onclick="toggleTag('simulation', this)">Simulation</button>
        </div>

        <div class="sub-group" id="sub-styles" style="display:none;">
            <button class="sub-btn" data-cat="3d" onclick="toggleTag('3d', this)">3D</button>
            <button class="sub-btn" data-cat="2d" onclick="toggleTag('2d', this)">2D</button>
            <button class="sub-btn" data-cat="pixel" onclick="toggleTag('pixel', this)">Pixel</button>
            <button class="sub-btn" data-cat="io" onclick="toggleTag('io', this)">.IO Games</button>
        </div>

        <div class="sub-group" id="sub-tags" style="display:none;">
            <button class="sub-btn" data-cat="car" onclick="toggleTag('car', this)">Car</button>
            <button class="sub-btn" data-cat="bike" onclick="toggleTag('bike', this)">Bike</button>
            <button class="sub-btn" data-cat="dressup" onclick="toggleTag('dressup', this)">Dress Up</button>
            <button class="sub-btn" data-cat="cooking" onclick="toggleTag('cooking', this)">Cooking</button>
            <button class="sub-btn" data-cat="runner" onclick="toggleTag('runner', this)">Runner</button>
            <button class="sub-btn" data-cat="clicker" onclick="toggleTag('clicker', this)">Clicker</button>
            <button class="sub-btn" data-cat="zombie" onclick="toggleTag('zombie', this)">Zombie</button>
        </div>
    </div>

    <!-- 游戏网格内容区 -->
    <main class="main-content">
        <div class="arcade-grid" id="game-grid"></div>
    </main>

    <!-- 页脚 -->
    <footer class="arcade-footer">
        <div class="footer-inner">
            <div>© 2026 Instant Game Station. All rights reserved.</div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Support</a>
            </div>
        </div>
    </footer>

    <script>
        let allGames = [];
        let activeFolderName = null;
        let selectedTags = new Map();
        let searchQuery = "";

        fetch('static/games.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(games => {
                allGames = games;
                renderGames(allGames);
            })
            .catch(err => {
                console.error('Error loading games:', err);
                document.getElementById('game-grid').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#ff5555;padding:40px 0;">Failed to load static/games.json file.</p>';
            });

        function openFolder(folderName, e) {
            const panel = document.getElementById('panel');
            document.querySelectorAll('.btn-folder').forEach(btn => btn.classList.remove('active'));

            if (activeFolderName === folderName && panel.classList.contains('open')) {
                panel.classList.remove('open');
                activeFolderName = null;
                return;
            }

            if (e && e.currentTarget) {
                e.currentTarget.classList.add('active');
            }

            document.querySelectorAll('.sub-group').forEach(g => g.style.display = 'none');
            document.getElementById('sub-' + folderName).style.display = 'flex';
            
            panel.classList.add('open');
            activeFolderName = folderName;
        }

        function goHome() {
            document.querySelectorAll('.btn-folder').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('selected'));
            
            selectedTags.clear();
            searchQuery = "";
            document.getElementById('search-input').value = "";
            updateSelectedTagsUI();

            document.getElementById('panel').classList.remove('open');
            activeFolderName = null;
            
            renderGames(allGames);
        }

        function toggleTag(cat, btnElement) {
            const catLower = cat.toLowerCase();
            const displayName = btnElement.textContent.trim();

            if (selectedTags.has(catLower)) {
                selectedTags.delete(catLower);
                btnElement.classList.remove('selected');
            } else {
                selectedTags.set(catLower, displayName);
                btnElement.classList.add('selected');
            }

            updateSelectedTagsUI();
            applyFilters();
        }

        function removeTag(catLower) {
            selectedTags.delete(catLower);
            document.querySelectorAll(`.sub-btn[data-cat="${catLower}"]`).forEach(btn => {
                btn.classList.remove('selected');
            });

            updateSelectedTagsUI();
            applyFilters();
        }

        function updateSelectedTagsUI() {
            const bar = document.getElementById('selected-tags-bar');
            const listContainer = document.getElementById('selected-tags-list');

            if (selectedTags.size === 0) {
                bar.classList.remove('active');
                listContainer.innerHTML = '';
            } else {
                bar.classList.add('active');
                let html = '';
                selectedTags.forEach((displayName, keyLower) => {
                    html += `
                        <span class="selected-chip">
                            ${displayName}
                            <span class="btn-close-chip" onclick="removeTag('${keyLower}')">✕</span>
                        </span>
                    `;
                });
                listContainer.innerHTML = html;
            }
        }

        function onSearchInput(val) {
            searchQuery = val.trim().toLowerCase();
            applyFilters();
        }

        function applyFilters() {
            const requiredKeys = Array.from(selectedTags.keys());

            const filtered = allGames.filter(game => {
                let gameCategories = [];
                if (Array.isArray(game.category)) {
                    gameCategories = game.category.map(c => c.toLowerCase());
                } else if (typeof game.category === 'string') {
                    gameCategories = [game.category.toLowerCase()];
                }

                const matchesTags = requiredKeys.every(tagKey => gameCategories.includes(tagKey));
                
                const title = (game.title || '').toLowerCase();
                const desc = (game.description || '').toLowerCase();
                const matchesSearch = !searchQuery || title.includes(searchQuery) || desc.includes(searchQuery);

                return matchesTags && matchesSearch;
            });

            renderGames(filtered);
        }

        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:60px 0;">No games match your selected filters.</p>';
                return;
            }

            list.forEach(game => {
                const gameId = game.id || game.slug;
                const coverImg = game.cover || game.image || 'https://via.placeholder.com/512';
                
                let categories = [];
                if (Array.isArray(game.category)) {
                    categories = game.category;
                } else if (typeof game.category === 'string') {
                    categories = [game.category];
                }
                const catText = categories.join(' • ');

                const div = document.createElement('div');
                div.className = 'game-card';
                div.innerHTML = `
                    <a href="game.html?id=${gameId}" class="card-link">
                        <div class="image-wrapper">
                            <img src="${coverImg}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/512?text=Game'">
                        </div>
                        <div class="card-meta">
                            <div class="cat-label">${catText}</div>
                            <div class="card-title">${game.title}</div>
                            <div class="card-author">${game.description || ''}</div>
                        </div>
                    </a>
                `;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
