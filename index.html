<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. 浏览器标签页标题 -->
    <title>LuluTap - Play Free Games</title>

    <!-- 2. 浏览器标签页图标（Favicon：Lu + 鼠标点击手势） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2307090e'/><text x='18' y='62' font-family='sans-serif' font-weight='900' font-size='48' fill='%2300f2fe'>Lu</text><path d='M58 42 L58 72 L66 65 L73 80 L79 77 L72 62 L82 62 Z' fill='%23ffffff' stroke='%2300f2fe' stroke-width='2.5'/></svg>">

    <!-- 引入样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 3. 顶部毛玻璃导航栏 -->
    <nav class="glass-navbar">
        <div class="nav-brand">
            <!-- 网站 Logo：Lu + 点击手势图标 -->
            <div class="brand-logo" style="background: linear-gradient(135deg, #00f2fe, #4facfe); border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; font-size: 1rem; position: relative;">
                Lu<span style="font-size: 0.75rem; position: absolute; right: 2px; bottom: 2px;">👆</span>
            </div>
            <div class="brand-name">Lulu<span class="highlight">Tap</span></div>
        </div>
        <div class="search-capsule">
            <input type="text" id="search-input" placeholder="Search games..." oninput="onSearchInput(this.value)">
        </div>
        <a href="#" class="action-btn">Featured</a>
    </nav>

    <!-- 4. 炫酷控制栏（首页 + 4个大集合展开按钮） -->
    <div class="category-control-bar">
        <button class="btn-home" onclick="goHome()">🔥 Show All Games</button>
        <button class="btn-folder" onclick="openFolder('players', event)">👥 Players ▾</button>
        <button class="btn-folder" onclick="openFolder('genres', event)">⚡ Genres ▾</button>
        <button class="btn-folder" onclick="openFolder('styles', event)">🎨 Styles ▾</button>
        <button class="btn-folder" onclick="openFolder('tags', event)">🎯 Tags ▾</button>
    </div>

    <!-- 5. 置顶的多选 Chip 胶囊栏（带 ✕ 关掉效果） -->
    <div class="selected-tags-bar" id="selected-tags-bar">
        Selected Filters: <div class="selected-tags-wrapper" id="selected-tags-list"></div>
    </div>

    <!-- 6. 3D 弹出式毛玻璃二级面板 -->
    <div class="sub-category-panel" id="panel">
        <div class="sub-group" id="sub-players" style="display:none;">
            <button class="sub-btn" data-cat="2player" onclick="toggleTag('2player', this)">2 Player</button>
            <button class="sub-btn" data-cat="singleplayer" onclick="toggleTag('singleplayer', this)">Single Player</button>
            <button class="sub-btn" data-cat="multiplayer" onclick="toggleTag('multiplayer', this)">Multiplayer</button>
            <button class="sub-btn" data-cat="boys" onclick="toggleTag('boys', this)">Boys</button>
            <button class="sub-btn" data-cat="girls" onclick="toggleTag('girls', this)">Girls</button>
            <button class="sub-btn" data-cat="kids" onclick="toggleTag('kids', this)">Kids</button>
        </div>

        <div class="sub-group" id="sub-genres" style="display:none;">
            <button class="sub-btn" data-cat="action" onclick="toggleTag('action', this)">Action</button>
            <button class="sub-btn" data-cat="racing" onclick="toggleTag('racing', this)">Racing</button>
            <button class="sub-btn" data-cat="driving" onclick="toggleTag('driving', this)">Driving</button>
            <button class="sub-btn" data-cat="shooting" onclick="toggleTag('shooting', this)">Shooting</button>
            <button class="sub-btn" data-cat="puzzle" onclick="toggleTag('puzzle', this)">Puzzle</button>
            <button class="sub-btn" data-cat="arcade" onclick="toggleTag('arcade', this)">Arcade</button>
            <button class="sub-btn" data-cat="casual" onclick="toggleTag('casual', this)">Casual</button>
            <button class="sub-btn" data-cat="sports" onclick="toggleTag('sports', this)">Sports</button>
            <button class="sub-btn" data-cat="adventure" onclick="toggleTag('adventure', this)">Adventure</button>
            <button class="sub-btn" data-cat="simulation" onclick="toggleTag('simulation', this)">Simulation</button>
        </div>

        <div class="sub-group" id="sub-styles" style="display:none;">
            <button class="sub-btn" data-cat="3d" onclick="toggleTag('3d', this)">3D</button>
            <button class="sub-btn" data-cat="2d" onclick="toggleTag('2d', this)">2D</button>
            <button class="sub-btn" data-cat="pixel" onclick="toggleTag('pixel', this)">Pixel</button>
            <button class="sub-btn" data-cat="io" onclick="toggleTag('io', this)">.IO Games</button>
        </div>

        <div class="sub-group" id="sub-tags" style="display:none;">
            <button class="sub-btn" data-cat="car" onclick="toggleTag('car', this)">Car</button>
            <button class="sub-btn" data-cat="bike" onclick="toggleTag('bike', this)">Bike</button>
            <button class="sub-btn" data-cat="dressup" onclick="toggleTag('dressup', this)">Dress Up</button>
            <button class="sub-btn" data-cat="cooking" onclick="toggleTag('cooking', this)">Cooking</button>
            <button class="sub-btn" data-cat="runner" onclick="toggleTag('runner', this)">Runner</button>
            <button class="sub-btn" data-cat="clicker" onclick="toggleTag('clicker', this)">Clicker</button>
            <button class="sub-btn" data-cat="zombie" onclick="toggleTag('zombie', this)">Zombie</button>
        </div>
    </div>

    <!-- 7. 游戏展示网格区 -->
    <main class="main-content">
        <div class="arcade-grid" id="game-grid"></div>
    </main>

    <!-- 8. 页脚 -->
    <footer class="arcade-footer">
        <div class="footer-inner">
            <div>© 2026 LuluTap. All rights reserved.</div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Support</a>
            </div>
        </div>
    </footer>

    <!-- 9. 🔥 核心交互 JS 逻辑（容错与全量兼容增强版） -->
    <script>
        let allGames = [];
        let activeFolderName = null;
        let selectedTags = new Map();
        let searchQuery = "";

        // 读取游戏数据（加上随机数防止浏览器强缓存）
        fetch('static/games.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(games => {
                allGames = games;
                console.log("成功加载游戏总数：", allGames.length); // 你可以在浏览器 F12 控制台打印看数量
                renderGames(allGames);
            })
            .catch(err => {
                console.error('Error loading games:', err);
                document.getElementById('game-grid').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#ff5555;padding:40px 0;">Failed to load static/games.json file.</p>';
            });

        // 展开 / 折叠集合面板
        function openFolder(folderName, e) {
            const panel = document.getElementById('panel');
            document.querySelectorAll('.btn-folder').forEach(btn => btn.classList.remove('active'));

            if (activeFolderName === folderName && panel.classList.contains('open')) {
                panel.classList.remove('open');
                activeFolderName = null;
                return;
            }

            if (e && e.currentTarget) {
                e.currentTarget.classList.add('active');
            }

            document.querySelectorAll('.sub-group').forEach(g => g.style.display = 'none');
            document.getElementById('sub-' + folderName).style.display = 'flex';
            
            panel.classList.add('open');
            activeFolderName = folderName;
        }

        // 点击 Show All / 重置
        function goHome() {
            document.querySelectorAll('.btn-folder').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('selected'));
            
            selectedTags.clear();
            searchQuery = "";
            document.getElementById('search-input').value = "";
            updateSelectedTagsUI();

            document.getElementById('panel').classList.remove('open');
            activeFolderName = null;
            
            renderGames(allGames);
        }

        // 选择 / 取消选择标签
        function toggleTag(cat, btnElement) {
            const catLower = cat.toLowerCase();
            const displayName = btnElement.textContent.trim();

            if (selectedTags.has(catLower)) {
                selectedTags.delete(catLower);
                btnElement.classList.remove('selected');
            } else {
                selectedTags.set(catLower, displayName);
                btnElement.classList.add('selected');
            }

            updateSelectedTagsUI();
            applyFilters();
        }

        // 移除顶部的 Chip 标签
        function removeTag(catLower) {
            selectedTags.delete(catLower);
            document.querySelectorAll(`.sub-btn[data-cat="${catLower}"]`).forEach(btn => {
                btn.classList.remove('selected');
            });

            updateSelectedTagsUI();
            applyFilters();
        }

        // 刷新顶部已选 Chip UI
        function updateSelectedTagsUI() {
            const bar = document.getElementById('selected-tags-bar');
            const listContainer = document.getElementById('selected-tags-list');

            if (selectedTags.size === 0) {
                bar.classList.remove('active');
                listContainer.innerHTML = '';
            } else {
                bar.classList.add('active');
                let html = '';
                selectedTags.forEach((displayName, keyLower) => {
                    html += `
                        <span class="selected-chip">
                            ${displayName}
                            <span class="btn-close-chip" onclick="removeTag('${keyLower}')">✕</span>
                        </span>
                    `;
                });
                listContainer.innerHTML = html;
            }
        }

        // 搜索框输入
        function onSearchInput(val) {
            searchQuery = val.trim().toLowerCase();
            applyFilters();
        }

        // 过滤逻辑（超强兼容版：同时兼容 category / categories 字段，支持大小写与模糊匹配）
        function applyFilters() {
            const requiredKeys = Array.from(selectedTags.keys());

            const filtered = allGames.filter(game => {
                // 1. 提取该游戏的所有分类标签（兼容单数 category 与复数 categories 字段）
                let rawCats = game.category || game.categories || [];
                if (typeof rawCats === 'string') {
                    rawCats = rawCats.split(',').map(s => s.trim());
                }
                const gameCategories = rawCats.map(c => String(c).toLowerCase());

                // 2. 标签匹配 (确保所选标签都能在游戏标签中找到)
                const matchesTags = requiredKeys.every(tagKey => {
                    return gameCategories.some(gc => gc.includes(tagKey) || tagKey.includes(gc));
                });
                
                // 3. 搜索框匹配
                const title = String(game.title || '').toLowerCase();
                const desc = String(game.description || '').toLowerCase();
                const matchesSearch = !searchQuery || title.includes(searchQuery) || desc.includes(searchQuery);

                return matchesTags && matchesSearch;
            });

            renderGames(filtered);
        }

        // 渲染卡片
        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:60px 0;">No games match your selected filters.</p>';
                return;
            }

            list.forEach(game => {
                const gameId = game.id || game.slug;
                const coverImg = game.cover || game.image || 'https://via.placeholder.com/512';
                
                let rawCats = game.category || game.categories || [];
                if (typeof rawCats === 'string') rawCats = [rawCats];
                const catText = rawCats.slice(0, 2).join(' • ');

                const div = document.createElement('div');
                div.className = 'game-card';
                div.innerHTML = `
                    <a href="game.html?id=${gameId}" class="card-link">
                        <div class="image-wrapper">
                            <img src="${coverImg}" alt="${game.title || 'Game'}" onerror="this.src='https://via.placeholder.com/512?text=Game'">
                        </div>
                        <div class="card-meta">
                            <div class="cat-label">${catText || 'GAME'}</div>
                            <div class="card-title">${game.title || 'Untitled Game'}</div>
                            <div class="card-author">${game.description || ''}</div>
                        </div>
                    </a>
                `;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
