<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Discover Fun Games</title>
    <style>
        /* === Global Base Styles === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* === 1. Top Header === */
        header {
            height: 60px;
            background: #161926;
            border-bottom: 1px solid #262b3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #00f2fe;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .logo:hover {
            opacity: 0.9;
        }

        .mode-btn {
            background: #222738;
            border: 1px solid #323950;
            color: #a0aec0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn:hover {
            color: #fff;
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* === 2. Sticky Multi-Tag Dropdown Bar === */
        .filter-wrapper {
            position: sticky;
            top: 60px;
            z-index: 90;
            background: rgba(15, 17, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222738;
            padding: 12px 24px;
        }

        .filter-container {
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .tags-dropdown-btn {
            background: #161926;
            border: 1px solid #262b3d;
            color: #00f2fe;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .tags-dropdown-btn:hover {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }

        .tags-dropdown-panel {
            position: absolute;
            top: 48px;
            left: 0;
            background: #161926;
            border: 1px solid #2a3146;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 600px;
            width: 90vw;
            z-index: 95;
            max-height: 320px;
            overflow-y: auto;
        }

        .tags-dropdown-panel.show {
            display: flex;
            animation: fadeInDown 0.2s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tag-chip {
            background: #222738;
            border: 1px solid #323950;
            color: #a0aec0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .tag-chip:hover {
            border-color: #00f2fe;
            color: #fff;
        }

        .tag-chip.active {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            color: #00f2fe;
            font-weight: 600;
        }

        .tag-chip .close-icon {
            font-size: 11px;
            opacity: 0.7;
        }

        .clear-all-btn {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid #ff4757;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: all 0.2s;
        }

        .clear-all-btn:hover {
            background: #ff4757;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        /* === 3. Top 10 Infinite Ticker Carousel === */
        .ticker-section {
            max-width: 1500px;
            width: 100%;
            margin: 20px auto 10px auto;
            padding: 0 24px;
        }

        .ticker-header {
            font-size: 14px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ticker-container {
            width: 100%;
            overflow: hidden;
            background: #161926;
            border: 1px solid #222738;
            border-radius: 12px;
            padding: 12px 0;
            position: relative;
        }

        .ticker-track {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: marqueeScroll 25s linear infinite;
        }

        .ticker-container:hover .ticker-track {
            animation-play-state: paused;
        }

        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ticker-card {
            width: 200px;
            height: 110px;
            flex-shrink: 0;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2b3248;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .ticker-card:hover {
            transform: scale(1.03);
            border-color: #00f2fe;
            z-index: 2;
        }

        .ticker-card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .ticker-card-overlay {
            position: relative;
            z-index: 1;
            background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0.2) 80%);
            padding: 8px;
        }

        .ticker-card-title {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* === 4. Bento Grid Layout === */
        .main-content {
            max-width: 1500px;
            width: 100%;
            margin: 10px auto 20px auto;
            padding: 0 24px;
            flex: 1;
            transition: max-width 0.3s ease;
        }

        body.mobile-mode .main-content,
        body.mobile-mode .ticker-section {
            max-width: 480px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            grid-auto-flow: dense;
        }

        body.mobile-mode .bento-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            position: relative;
            background: #161926;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222738;
            text-decoration: none;
            color: #fff;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f2fe;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.25);
            z-index: 2;
        }

        .game-card.featured {
            grid-column: span 2;
            grid-row: span 2;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
        }

        body.mobile-mode .game-card.featured {
            grid-column: span 2;
            grid-row: span 1;
            aspect-ratio: 16 / 9;
        }

        .card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s;
        }

        .game-card:hover .card-cover {
            transform: scale(1.05);
        }

        .card-overlay {
            position: relative;
            z-index: 1;
            background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0.4) 70%, rgba(15,17,26,0) 100%);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .featured .card-title {
            font-size: 18px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #a0aec0;
            margin-top: 2px;
        }

        .card-tag {
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .card-like-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 600;
            color: #a0aec0;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }

        .card-like-badge.liked {
            color: #ff4757;
        }

        .loading-status {
            text-align: center;
            padding: 30px 0;
            color: #a0aec0;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #323950;
            border-top: 2px solid #00f2fe;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .game-card.featured {
                grid-column: span 2;
                grid-row: span 1;
                aspect-ratio: 16 / 9;
            }

            .filter-wrapper, .ticker-section, .main-content {
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Header -->
    <header>
        <a href="index.html" class="logo">🕹️ LuluTap</a>
        <button class="mode-btn" id="mode-btn" onclick="toggleDeviceMode()">💻 PC Mode</button>
    </header>

    <!-- 2. Sticky Filter Bar with Tags Dropdown -->
    <div class="filter-wrapper">
        <div class="filter-container">
            <div>
                <button class="tags-dropdown-btn" id="tags-btn" onclick="toggleTagsDropdown(event)">
                    <span>🏷️ Tags</span>
                    <span id="dropdown-arrow">▾</span>
                </button>
                <div class="tags-dropdown-panel" id="tags-panel"></div>
            </div>
            
            <button class="clear-all-btn" id="clear-all-btn" onclick="clearAllFilters()">✕ Clear All</button>
        </div>
    </div>

    <!-- 3. Top 10 Trending Games Infinite Ticker Carousel -->
    <section class="ticker-section">
        <div class="ticker-header">🔥 Top 10 Trending Games</div>
        <div class="ticker-container">
            <div class="ticker-track" id="ticker-track"></div>
        </div>
    </section>

    <!-- 4. Main Bento Game Grid -->
    <main class="main-content">
        <div class="bento-grid" id="game-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #a0aec0;">
                <div class="spinner" style="margin: 0 auto 12px auto; width: 24px; height: 24px;"></div>
                Loading games list...
            </div>
        </div>

        <div class="loading-status" id="loading-status" style="display: none;">
            <div class="spinner"></div>
            <span>Auto-loading more games...</span>
        </div>
    </main>

    <script>
        // 预设核心分类标签，保障数据加载前也有完整标签列表
        let allCategories = ["🔥 All", "Action", "Arcade", "Puzzle", "Racing", "Shooting", "Casual", "Strategy", "Sports"];
        let selectedTags = [];
        let gamesData = []; 
        let currentPage = 1;
        let isLoading = false;
        let hasMoreData = true;
        let isMobileMode = false;

        const extraTagsPool = ["🔥 Hot", "⚡ Fast", "🎮 3D", "🏆 Top", "⭐ Popular", "🕹️ Classic", "🎯 Skill"];

        const mockFallbackGames = Array.from({ length: 18 }).map((_, i) => ({
            id: `fallback-${i}`,
            title: `Popular Game ${i + 1}`,
            category: ["Action", "Arcade", "Puzzle", "Racing", "Shooting"][i % 5],
            thumb: `https://picsum.photos/seed/${i + 100}/400/400`,
            url: "https://html5.gamedistribution.com/rvvAS30838184/",
            description: "An exciting browser action game designed for ultimate fun and challenge."
        }));

        function getLikesData() {
            return JSON.parse(localStorage.getItem('lulutap_likes') || '{}');
        }

        function getGameLikesInfo(title, baseLikes = 0) {
            const likesStore = getLikesData();
            const record = likesStore[title] || { count: baseLikes || Math.floor(Math.random() * 800) + 120, userLiked: false };
            return record;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function toggleDeviceMode() {
            isMobileMode = !isMobileMode;
            const btn = document.getElementById('mode-btn');
            if (isMobileMode) {
                document.body.classList.add('mobile-mode');
                btn.innerHTML = '📱 Mobile Mode';
            } else {
                document.body.classList.remove('mobile-mode');
                btn.innerHTML = '💻 PC Mode';
            }
        }

        function toggleTagsDropdown(e) {
            e.stopPropagation();
            const panel = document.getElementById('tags-panel');
            const arrow = document.getElementById('dropdown-arrow');
            const isOpen = panel.classList.contains('show');

            if (isOpen) {
                panel.classList.remove('show');
                arrow.innerText = '▾';
            } else {
                panel.classList.add('show');
                arrow.innerText = '▴';
            }
        }

        document.addEventListener('click', (e) => {
            const panel = document.getElementById('tags-panel');
            const btn = document.getElementById('tags-btn');
            if (panel && !panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.remove('show');
                document.getElementById('dropdown-arrow').innerText = '▾';
            }
        });

        function goToGame(game) {
            let history = JSON.parse(localStorage.getItem('lulutap_recent') || '[]');
            history = history.filter(item => item.title !== game.title);
            history.unshift(game);
            if (history.length > 20) history.pop();
            localStorage.setItem('lulutap_recent', JSON.stringify(history));

            const query = new URLSearchParams({
                url: game.gameUrl,
                title: game.title,
                img: game.img || '',
                cat: game.category || 'Arcade',
                desc: game.description || 'Enjoy playing ' + game.title + ' on LuluTap!'
            }).toString();

            window.location.href = `game.html?${query}`;
        }

        async function initGameData(page = 1) {
            if (isLoading) return;
            isLoading = true;

            const grid = document.getElementById('game-grid');
            const status = document.getElementById('loading-status');

            if (page > 1) {
                status.style.display = 'flex';
            }

            try {
                let rawList = [];
                try {
                    const response = await fetch(`https://gamemonetize.com/feed.php?format=0&page=${page}`);
                    if (!response.ok) throw new Error("HTTP error " + response.status);
                    const data = await response.json();
                    rawList = Array.isArray(data) ? data : [];
                } catch (e) {
                    console.warn("API Fetch Failed/CORS limit, fallbacking to simulated mock data.", e);
                    rawList = mockFallbackGames;
                }
                
                if (rawList.length === 0) {
                    hasMoreData = false;
                    status.innerHTML = "✨ You've reached the end!";
                    return;
                }

                const shuffledList = shuffle([...rawList]);

                const formattedGames = shuffledList.map((item) => {
                    const catName = item.category || "Other";
                    
                    if (!allCategories.includes(catName)) {
                        allCategories.push(catName);
                    }

                    const gameTags = [catName]; 
                    const shuffledExtra = shuffle([...extraTagsPool]);
                    gameTags.push(shuffledExtra[0]);
                    if (Math.random() > 0.5) {
                        gameTags.push(shuffledExtra[1]);
                    }

                    const baseLikes = Math.floor(Math.random() * 800) + 100;

                    return {
                        id: item.id || `game-${Math.random()}`,
                        title: item.title || item.name || "Untitled Game",
                        category: catName,
                        tags: gameTags,
                        img: item.thumb || 'https://via.placeholder.com/300',
                        gameUrl: item.url || '#',
                        description: item.description || '',
                        baseLikes: baseLikes
                    };
                });

                if (page === 1) {
                    renderTop10Ticker(formattedGames.slice(0, 10));
                    gamesData = formattedGames;
                } else {
                    gamesData = [...gamesData, ...formattedGames];
                }

                assignFeaturedCards();
                renderTags();
                renderGames();
            } catch (err) {
                console.error("Critical Execution Error:", err);
            } finally {
                isLoading = false;
                status.style.display = 'none';
            }
        }

        function assignFeaturedCards() {
            let nextFeaturedIndex = 0;
            
            gamesData.forEach((game, idx) => {
                if (idx === nextFeaturedIndex) {
                    game.featured = true;
                    nextFeaturedIndex += Math.floor(Math.random() * 3) + 7; 
                } else {
                    game.featured = false;
                }
            });
        }

        function renderTop10Ticker(top10List) {
            const track = document.getElementById('ticker-track');
            if (!top10List || top10List.length === 0) return;

            const listToRender = [...top10List, ...top10List];

            track.innerHTML = listToRender.map((game, index) => `
                <div class="ticker-card" onclick="goToGame(gamesData[${index % top10List.length}])">
                    <div class="ticker-card-cover" style="background-image: url('${game.img}');"></div>
                    <div class="ticker-card-overlay">
                        <div class="ticker-card-title">${game.title}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderTags() {
            const container = document.getElementById('tags-panel');
            const clearBtn = document.getElementById('clear-all-btn');
            const btnText = document.querySelector('.tags-dropdown-btn span');

            container.innerHTML = allCategories.map(cat => {
                const isAll = cat === "🔥 All";
                const isSelected = isAll ? selectedTags.length === 0 : selectedTags.includes(cat);
                
                return `
                    <div class="tag-chip ${isSelected ? 'active' : ''}" onclick="toggleTag('${cat}')">
                        <span>${cat}</span>
                        ${!isAll && isSelected ? '<span class="close-icon">✕</span>' : ''}
                    </div>
                `;
            }).join('');

            if (selectedTags.length > 0) {
                btnText.innerText = `🏷️ Tags (${selectedTags.length})`;
            } else {
                btnText.innerText = `🏷️ Tags`;
            }

            clearBtn.style.display = selectedTags.length >= 1 ? 'block' : 'none';
        }

        function toggleTag(cat) {
            if (cat === "🔥 All") {
                selectedTags = [];
            } else {
                if (selectedTags.includes(cat)) {
                    selectedTags = selectedTags.filter(t => t !== cat);
                } else {
                    selectedTags.push(cat);
                }
            }
            renderTags();
            renderGames();
        }

        function clearAllFilters() {
            selectedTags = [];
            renderTags();
            renderGames();
        }

        function renderGames() {
            const grid = document.getElementById('game-grid');
            
            const filtered = gamesData.filter(game => {
                if (selectedTags.length === 0) return true;
                return selectedTags.every(tag => game.tags.includes(tag));
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #a0aec0;">No matching games found. Try resetting filters!</div>`;
                return;
            }

            grid.innerHTML = filtered.map((game) => {
                const likeInfo = getGameLikesInfo(game.title, game.baseLikes);

                return `
                <div onclick="goToGame(gamesData[${gamesData.indexOf(game)}])" class="game-card ${game.featured ? 'featured' : ''}">
                    <div class="card-cover" style="background-image: url('${game.img}');"></div>
                    <div class="card-overlay">
                        <div class="card-title">${game.title}</div>
                        <div class="card-meta">
                            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                                ${game.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                            </div>
                            <div class="card-like-badge ${likeInfo.userLiked ? 'liked' : ''}">
                                ${likeInfo.userLiked ? '❤️' : '🤍'} ${likeInfo.count}
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        window.addEventListener('pageshow', () => {
            if (gamesData.length > 0) {
                renderGames();
            }
        });

        window.addEventListener('scroll', () => {
            if (isLoading || !hasMoreData) return;
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
                currentPage++;
                initGameData(currentPage);
            }
        });

        // 初始化运行
        renderTags();
        initGameData();
    </script>
</body>
</html>
