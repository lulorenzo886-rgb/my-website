<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Classic Online Games</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #12131C; color: #ffffff; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #6C5CE7; margin-bottom: 10px; }
        .nav-categories { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
        .nav-btn { background-color: #1A1C29; color: #A0A5BA; border: 1px solid #2B2D3E; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .nav-btn.active, .nav-btn:hover { background-color: #6C5CE7; color: #fff; border-color: #6C5CE7; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #1A1C29; border-radius: 12px; overflow: hidden; border: 1px solid #2B2D3E; transition: transform 0.2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: #6C5CE7; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-info { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .card-cat { font-size: 12px; color: #6C5CE7; text-transform: uppercase; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Free Classic Games</h1>
        <p>Play instant HTML5 games directly in your browser!</p>
    </header>

    <div class="nav-categories" id="category-bar">
        <button class="nav-btn active" onclick="filterGames('all')">🔥 All</button>
        <button class="nav-btn" onclick="filterGames('action')">Action</button>
        <button class="nav-btn" onclick="filterGames('racing')">Racing</button>
        <button class="nav-btn" onclick="filterGames('puzzle')">Puzzle</button>
    </div>

    <div class="grid" id="game-grid">
        <!-- 游戏卡片会自动在这里生成 -->
    </div>

    <script>
        let allGames = [];

        // 强行加上时间戳防止浏览器缓存 games.json
        fetch('static/games.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(games => {
                allGames = games;
                renderGames(allGames);
            })
            .catch(err => {
                console.error('Error:', err);
                document.getElementById('game-grid').innerHTML = '<p style="text-align:center;grid-column:1/-1;">加载失败，请检查 static/games.json 路径或语法。</p>';
            });

        function renderGames(list) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            if (!list || list.length === 0) {
                grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;">暂无该分类下的游戏。</p>';
                return;
            }

            list.forEach(game => {
                const gameId = game.id || game.slug;
                const coverImg = game.cover || game.image || 'https://via.placeholder.com/512';
                const category = game.category || 'arcade';

                const a = document.createElement('a');
                a.className = 'card';
                a.href = `game.html?id=${gameId}`;
                a.innerHTML = `
                    <img src="${coverImg}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/512'">
                    <div class="card-info">
                        <div class="card-title">${game.title}</div>
                        <div class="card-cat">${category}</div>
                    </div>
                `;
                grid.appendChild(a);
            });
        }

        function filterGames(cat) {
            // 切换按钮样式
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (cat === 'all') {
                renderGames(allGames);
            } else {
                const filtered = allGames.filter(g => (g.category || '').toLowerCase() === cat.toLowerCase());
                renderGames(filtered);
            }
        }
    </script>
</body>
</html>
