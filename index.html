<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Play Free Online Games</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f111a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LuluTap">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background-color: #0f111a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* Header */
        header { height: 64px; background: #161926; border-bottom: 1px solid #262b3d; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100; gap: 12px; }
        .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; gap: 8px; }
        .logo-icon { width: 36px; height: 36px; }
        .logo-text { font-weight: 900; font-size: 26px; background: linear-gradient(135deg, #00F2FE 0%, #4FACFE 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .header-right { display: flex; align-items: center; gap: 10px; }
        .search-box { position: relative; max-width: 200px; width: 100%; }
        .search-input { width: 100%; background: #0f111a; border: 1px solid #2a3148; border-radius: 20px; padding: 8px 16px 8px 36px; color: #fff; font-size: 13px; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: #00f2fe; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #718096; font-size: 14px; }

        /* Surprise Me Button */
        .random-btn { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); border: none; color: #fff; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: transform 0.2s; flex-shrink: 0; }
        .random-btn:hover { transform: scale(1.05); }

        .lang-selector { background: #0f111a; border: 1px solid #2a3148; color: #fff; padding: 6px 10px; border-radius: 16px; font-size: 12px; outline: none; cursor: pointer; }

        /* Sticky Tags Nav */
        .tags-nav-wrapper { position: sticky; top: 64px; z-index: 90; background: rgba(15, 17, 26, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #222738; padding: 10px 24px; }
        .tags-scroll-container { max-width: 1500px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .tags-scroll-container::-webkit-scrollbar { display: none; }
        .tag-nav-item { background: #161926; border: 1px solid #262b3d; color: #a0aec0; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; transition: all 0.2s; flex-shrink: 0; }
        .tag-nav-item.active, .tag-nav-item:hover { border-color: #00f2fe; color: #fff; background: rgba(0, 242, 254, 0.1); }

        /* PWA Install Banner */
        .pwa-banner { background: linear-gradient(90deg, #161926 0%, #1e2436 100%); border-bottom: 1px solid #00f2fe; padding: 10px 24px; display: none; align-items: center; justify-content: space-between; font-size: 13px; }
        .pwa-btn { background: #00f2fe; color: #0f111a; border: none; padding: 6px 14px; border-radius: 14px; font-weight: bold; cursor: pointer; }

        /* Main Shelf */
        .main-content { max-width: 1500px; width: 100%; margin: 0 auto; padding: 20px 24px 40px 24px; flex: 1; }
        .category-section { margin-bottom: 32px; scroll-margin-top: 130px; }
        .category-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .category-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .category-title::before { content: ''; width: 4px; height: 18px; background: #00f2fe; border-radius: 2px; }
        .see-all-btn { color: #00f2fe; text-decoration: none; font-size: 13px; font-weight: 600; }

        /* 循环无限滚动动画核心 CSS */
        .row-scroll-container { width: 100%; overflow: hidden; position: relative; }
        .row-scroll-track { display: flex; gap: 16px; width: max-content; animation: infiniteScroll 30s linear infinite; }
        .row-scroll-container:hover .row-scroll-track { animation-play-state: paused; }

        @keyframes infiniteScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Cards & Favorite Heart */
        .game-card { width: 180px; height: 180px; flex-shrink: 0; position: relative; background: #161926; border-radius: 12px; overflow: hidden; border: 1px solid #222738; text-decoration: none; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; transition: transform 0.25s, border-color 0.25s; cursor: pointer; }
        .game-card:hover { transform: translateY(-4px); border-color: #00f2fe; box-shadow: 0 6px 20px rgba(0, 242, 254, 0.2); }
        .card-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: transform 0.3s; }
        .game-card:hover .card-cover { transform: scale(1.05); }
        .card-overlay { position: relative; z-index: 1; background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0) 100%); padding: 10px; }
        .card-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .fav-heart-btn { position: absolute; top: 8px; right: 8px; z-index: 2; background: rgba(15, 17, 26, 0.7); border: none; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: #a0aec0; cursor: pointer; font-size: 14px; backdrop-filter: blur(4px); transition: transform 0.2s, color 0.2s; }
        .fav-heart-btn.active { color: #ff0844; }
        .fav-heart-btn:hover { transform: scale(1.15); }

        .loading-box { text-align: center; padding: 60px; color: #a0aec0; }

        /* Footer */
        footer { background: #161926; border-top: 1px solid #262b3d; padding: 32px 24px; text-align: center; margin-top: auto; }
        .footer-links { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
        .footer-link { color: #a0aec0; text-decoration: none; font-size: 13px; }
        .footer-link:hover { color: #00f2fe; }
        .footer-copyright { font-size: 12px; color: #718096; }

        #google_translate_element { display: none; }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }

        @media (max-width: 768px) { .game-card { width: 140px; height: 140px; } .search-box { max-width: 130px; } .logo-text { display: none; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
                <rect width="100" height="100" rx="20" fill="#161926"/>
                <path d="M30 40H70C75.5228 40 80 44.4772 80 50V60C80 65.5228 75.5228 70 70 70C64.4772 70 60 65.5228 60 60V55H40V60C40 65.5228 35.5228 70 30 70C24.4772 70 20 65.5228 20 60V50C20 44.4772 24.4772 40 30 40Z" fill="#00F2FE"/>
                <circle cx="35" cy="50" r="4" fill="#0F111A"/>
                <circle cx="65" cy="48" r="3" fill="#0F111A"/>
                <circle cx="72" cy="54" r="3" fill="#0F111A"/>
            </svg>
            <span class="logo-text">LuluTap</span>
        </a>

        <div class="header-right">
            <button class="random-btn" onclick="playRandomGame()">🎲 Surprise Me</button>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Search..." oninput="handleSearch(this.value)">
            </div>
            <select class="lang-selector" id="lang-select" onchange="changeLanguage(this.value)">
                <option value="en">🇺🇸 English</option>
                <option value="zh-CN">🇨🇳 简体中文</option>
                <option value="es">🇪🇸 Español</option>
                <option value="hi">🇮🇳 हिन्दी</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="ar">🇸🇦 العربية</option>
                <option value="pt">🇧🇷 Português</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="ja">🇯🇵 日本語</option>
            </select>
        </div>
    </header>

    <div class="pwa-banner" id="pwa-banner">
        <span>📲 Add <b>LuluTap</b> to Home Screen for instant play!</span>
        <button class="pwa-btn" id="pwa-install-btn">Install</button>
    </div>

    <div id="google_translate_element"></div>

    <nav class="tags-nav-wrapper">
        <div class="tags-scroll-container" id="tags-bar"></div>
    </nav>

    <main class="main-content" id="main-content">
        <div class="loading-box">Loading games catalog...</div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="privacy.html" class="footer-link">Privacy Policy</a>
            <a href="terms.html" class="footer-link">Terms of Service</a>
            <a href="dmca.html" class="footer-link">DMCA Policy</a>
            <a href="contact.html" class="footer-link">Contact Us</a>
        </div>
        <div class="footer-copyright">© 2026 LuluTap. All rights reserved. Play free online browser games.</div>
    </footer>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const FIXED_TAGS = [
            ".IO", "2 Player", "3D", "Bejeweled", "Boys", "Clicker", 
            "Cooking", "Girls", "Multiplayer", "Puzzle", "Shooting", 
            "Racing", "Soccer", "Sports", "Stickman"
        ];

        let allGames = [];
        let gameMap = {};
        let categorizedGames = {};
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-banner').style.display = 'flex';
        });

        document.getElementById('pwa-install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('pwa-banner').style.display = 'none';
            }
        });

        function initLanguage() {
            const savedLang = localStorage.getItem('lulutap_lang');
            let targetLang = 'en';

            if (savedLang) {
                targetLang = savedLang;
            } else {
                const navLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
                if (navLang.startsWith('zh')) targetLang = 'zh-CN';
                else if (navLang.startsWith('es')) targetLang = 'es';
                else if (navLang.startsWith('hi')) targetLang = 'hi';
                else if (navLang.startsWith('fr')) targetLang = 'fr';
                else if (navLang.startsWith('ar')) targetLang = 'ar';
                else if (navLang.startsWith('pt')) targetLang = 'pt';
                else if (navLang.startsWith('ru')) targetLang = 'ru';
                else if (navLang.startsWith('de')) targetLang = 'de';
                else if (navLang.startsWith('ja')) targetLang = 'ja';
            }

            document.getElementById('lang-select').value = targetLang;
            if (targetLang !== 'en') {
                setTimeout(() => { doGoogleTranslate(targetLang); }, 1000);
            }
        }

        function changeLanguage(langCode) {
            localStorage.setItem('lulutap_lang', langCode);
            doGoogleTranslate(langCode);
        }

        function doGoogleTranslate(langCode) {
            const selectEl = document.querySelector('.goog-te-combo');
            if (selectEl) {
                selectEl.value = langCode;
                selectEl.dispatchEvent(new Event('change'));
            }
        }

        function toggleFavoriteById(e, gameId) {
            e.stopPropagation();
            const game = gameMap[gameId];
            if (!game) return;
            let favs = JSON.parse(localStorage.getItem('lulutap_favorites') || '[]');
            const index = favs.findIndex(f => f.id === game.id);
            if (index > -1) {
                favs.splice(index, 1);
            } else {
                favs.unshift(game);
            }
            localStorage.setItem('lulutap_favorites', JSON.stringify(favs));
            renderShelf();
        }

        function isFavorite(gameId) {
            let favs = JSON.parse(localStorage.getItem('lulutap_favorites') || '[]');
            return favs.some(f => f.id === gameId);
        }

        function playRandomGame() {
            if (allGames.length > 0) {
                const random = allGames[Math.floor(Math.random() * allGames.length)];
                saveAndGoById(random.id);
            }
        }

        function saveAndGoById(gameId) {
            const game = gameMap[gameId];
            if (!game) return;
            let recent = JSON.parse(localStorage.getItem('lulutap_recent') || '[]');
            recent = recent.filter(g => g.id !== game.id);
            recent.unshift(game);
            if (recent.length > 10) recent.pop();
            localStorage.setItem('lulutap_recent', JSON.stringify(recent));

            const params = new URLSearchParams({
                id: game.id, title: game.title, url: game.gameUrl, img: game.img,
                cat: game.category, desc: game.description || '', inst: game.instructions || ''
            });
            window.location.href = `game.html?${params.toString()}`;
        }

        function scrollToCategory(catName, el) {
            document.querySelectorAll('.tag-nav-item').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            const target = document.getElementById(`cat-row-${catName.replace(/[^a-zA-Z0-9]/g, '-')}`);
            if (target) target.scrollIntoView({ behavior: 'smooth' });
        }

        function handleSearch(keyword) {
            const term = keyword.trim().toLowerCase();
            if(!term) { renderShelf(); return; }
            const filtered = allGames.filter(g => g.title.toLowerCase().includes(term));
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <section class="category-section">
                    <div class="category-header"><div class="category-title">Search Results (${filtered.length})</div></div>
                    <div class="row-scroll-container">
                        <div class="row-scroll-track" style="animation: none; flex-wrap: wrap;">
                            ${filtered.map(g => renderCardHtml(g)).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        function renderCardHtml(g) {
            const isFav = isFavorite(g.id);
            const safeTitle = g.title.replace(/"/g, '&quot;');
            return `
                <div class="game-card" onclick="saveAndGoById('${g.id}')">
                    <button class="fav-heart-btn ${isFav ? 'active' : ''}" onclick="toggleFavoriteById(event, '${g.id}')">
                        ${isFav ? '❤️' : '🤍'}
                    </button>
                    <div class="card-cover" style="background-image: url('${g.img}');"></div>
                    <div class="card-overlay"><div class="card-title">${safeTitle}</div></div>
                </div>
            `;
        }

        function renderLoopRow(gamesList) {
            if (!gamesList || gamesList.length === 0) return '';
            
            let displayList = [...gamesList];
            while (displayList.length < 12) {
                displayList = displayList.concat(gamesList);
            }
            
            const rawCardsHtml = displayList.map(g => renderCardHtml(g)).join('');
            return `
                <div class="row-scroll-container">
                    <div class="row-scroll-track">
                        ${rawCardsHtml}
                        ${rawCardsHtml}
                    </div>
                </div>
            `;
        }

        function generateMockGames() {
            return Array.from({length: 60}).map((_, i) => ({
                id: `mock-${i}`, 
                title: `Game ${i+1}`, 
                category: FIXED_TAGS[i % FIXED_TAGS.length],
                img: `https://picsum.photos/seed/${i+100}/300/300`, 
                gameUrl: "https://html5.gamedistribution.com/rvvAS30838184/",
                description: "Fun online game.", 
                instructions: "Use WASD or Spacebar."
            }));
        }

        async function fetchGamesWithFallback() {
            const targetUrl = 'https://gamemonetize.com/feed.php?format=0&page=1';
            
            // 尝试 1: corsproxy.io
            try {
                const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
                if (res.ok) {
                    const raw = await res.json();
                    if (Array.isArray(raw) && raw.length > 0) return raw;
                }
            } catch (e) { console.warn("Proxy 1 failed:", e); }

            // 尝试 2: api.allorigins.win
            try {
                const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
                if (res.ok) {
                    const raw = await res.json();
                    if (Array.isArray(raw) && raw.length > 0) return raw;
                }
            } catch (e) { console.warn("Proxy 2 failed:", e); }

            // 兜底返回模拟数据
            return generateMockGames();
        }

        async function initData() {
            const rawData = await fetchGamesWithFallback();
            
            allGames = rawData.map((item, i) => ({
                id: item.id ? String(item.id) : `g-${i}`,
                title: item.title || `Game ${i+1}`,
                category: item.category || "Puzzle",
                img: item.thumb || `https://picsum.photos/seed/${i+200}/300/300`, 
                gameUrl: item.url || "https://html5.gamedistribution.com/rvvAS30838184/",
                description: item.description || '', 
                instructions: item.instructions || ''
            }));

            gameMap = {};
            categorizedGames = {};
            FIXED_TAGS.forEach(tag => { categorizedGames[tag] = []; });

            allGames.forEach(g => {
                gameMap[g.id] = g;
                const catLower = g.category.toLowerCase();
                FIXED_TAGS.forEach(tag => {
                    if (catLower.includes(tag.toLowerCase()) || tag.toLowerCase().includes(catLower)) {
                        categorizedGames[tag].push(g);
                    }
                });
            });

            renderTagsNav();
            renderShelf();
            initLanguage();
        }

        function renderTagsNav() {
            const bar = document.getElementById('tags-bar');
            let tagsHtml = `<div class="tag-nav-item" onclick="scrollToCategory('Favorites', this)">❤️ My Favorites</div>`;
            tagsHtml += `<div class="tag-nav-item" onclick="scrollToCategory('Recently-Played', this)">🕒 Recently Played</div>`;
            tagsHtml += `<div class="tag-nav-item" onclick="scrollToCategory('Hot-Games', this)">🔥 Hot Games</div>`;
            FIXED_TAGS.forEach(cat => {
                tagsHtml += `<div class="tag-nav-item" onclick="scrollToCategory('${cat}', this)">${cat}</div>`;
            });
            bar.innerHTML = tagsHtml;
        }

        function renderShelf() {
            const main = document.getElementById('main-content');
            let html = '';

            const favs = JSON.parse(localStorage.getItem('lulutap_favorites') || '[]');
            if (favs.length > 0) {
                html += `
                    <section class="category-section" id="cat-row-Favorites">
                        <div class="category-header"><div class="category-title">❤️ My Favorites</div></div>
                        ${renderLoopRow(favs)}
                    </section>
                `;
            }

            const recent = JSON.parse(localStorage.getItem('lulutap_recent') || '[]');
            if (recent.length > 0) {
                html += `
                    <section class="category-section" id="cat-row-Recently-Played">
                        <div class="category-header"><div class="category-title">🕒 Recently Played</div></div>
                        ${renderLoopRow(recent)}
                    </section>
                `;
            }

            html += `
                <section class="category-section" id="cat-row-Hot-Games">
                    <div class="category-header"><div class="category-title">🔥 Hot Games</div></div>
                    ${renderLoopRow(allGames.slice(0, 15))}
                </section>
            `;

            FIXED_TAGS.forEach(cat => {
                let games = categorizedGames[cat];
                if (!games || games.length === 0) games = allGames.slice(0, 10);
                else games = games.slice(0, 10);
                
                const safeCat = cat.replace(/[^a-zA-Z0-9]/g, '-');
                html += `
                    <section class="category-section" id="cat-row-${safeCat}">
                        <div class="category-header">
                            <div class="category-title">${cat}</div>
                            <a href="category.html?type=${encodeURIComponent(cat)}" class="see-all-btn">See All ></a>
                        </div>
                        ${renderLoopRow(games)}
                    </section>
                `;
            });

            main.innerHTML = html;
        }

        initData();
    </script>
</body>
</html>
