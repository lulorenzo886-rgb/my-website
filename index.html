<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuluTap - Free Online Games</title>
  
  <!-- 方案三：传送门 SVG Data-URI 图标 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='50%25' cy='50%25' r='50%25'%3E%3Cstop offset='0%25' stop-color='%23141E30'/%3E%3Cstop offset='100%25' stop-color='%23070B12'/%3E%3C/radialGradient%3E%3ClinearGradient id='ring' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300FF87'/%3E%3Cstop offset='100%25' stop-color='%2360EFFF'/%3E%3C/linearGradient%3E%3CradialGradient id='btn' cx='40%25' cy='40%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%2300FF87'/%3E%3Cstop offset='100%25' stop-color='%23005C31'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23bg)'/%3E%3Ccircle cx='256' cy='256' r='180' fill='none' stroke='url(%23ring)' stroke-width='24'/%3E%3Ccircle cx='256' cy='256' r='95' fill='url(%23btn)'/%3E%3Cpath d='M230 200 V290 H300' fill='none' stroke='%23FFFFFF' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #0d1117; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    header { background: #161b22; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #21262d; sticky: top; top: 0; z-index: 1000; }
    .logo { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, #00FF87, #60EFFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .search-container { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 100%; max-width: 420px; }
    .quick-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .tag-pill { background: #21262d; color: #00FF87; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; border: 1px solid #30363d; transition: 0.2s; }
    .tag-pill:hover { background: #00FF87; color: #0d1117; }
    .search-input { width: 100%; padding: 10px 16px; background: #0d1117; border: 2px solid #30363d; border-radius: 20px; color: #fff; font-size: 14px; outline: none; }
    .search-input:focus { border-color: #00FF87; }

    main { flex: 1; max-width: 1400px; margin: 0 auto; padding: 20px; width: 100%; }
    .section-title { font-size: 20px; margin-bottom: 16px; font-weight: 700; }
    .bento-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); grid-auto-rows: 130px; grid-auto-flow: dense; gap: 12px; margin-bottom: 40px; }
    .bento-item { position: relative; border-radius: 16px; overflow: hidden; background: #161b22; border: 1px solid #21262d; transition: 0.2s; cursor: pointer; }
    .bento-item:hover { transform: scale(1.03); box-shadow: 0 8px 20px rgba(0,255,135,0.2); z-index: 2; }
    .bento-item.size-1x1 { grid-column: span 1; grid-row: span 1; }
    .bento-item.size-2x2 { grid-column: span 2; grid-row: span 2; }
    .bento-item.size-2x1 { grid-column: span 2; grid-row: span 1; }
    .bento-item.size-1x2 { grid-column: span 1; grid-row: span 2; }
    .bento-img { width: 100%; height: 100%; object-fit: cover; }
    .bento-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .category-card { height: 100px; border-radius: 16px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; border: 2px solid #30363d; transition: 0.2s; }
    .category-card:hover { transform: translateY(-3px); border-color: #00FF87; }
    .category-card img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.4; z-index: 1; }
    .category-card span { position: relative; z-index: 2; text-shadow: 0 2px 4px #000; }

    footer { background: #161b22; padding: 24px; text-align: center; border-top: 1px solid #21262d; color: #8b949e; font-size: 13px; }
    .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">LuluTap</a>
    <div class="search-container">
      <div class="quick-tags" id="quickTags"></div>
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search games or tags...">
    </div>
  </header>

  <main>
    <div class="section-title">🔥 Featured Games</div>
    <div class="bento-grid" id="bentoGrid"></div>
    <div class="section-title">🟢 Browse Categories</div>
    <div class="category-grid" id="categoryGrid"></div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="#">Privacy Policy</a> <a href="#">Terms of Service</a> <a href="#">DMCA Policy</a> <a href="#">Contact</a>
    </div>
    <div>© 2026 LuluTap. All rights reserved.</div>
  </footer>

  <script>
    const CATEGORIES = ['Action', '2 Player', '3D', 'Racing', 'Girls', 'Arcade', 'Puzzle', 'Shooting', 'Sports', 'Casual'];

    function renderQuickTags() {
      const selected = [...CATEGORIES].sort(() => 0.5 - Math.random()).slice(0, 5);
      document.getElementById('quickTags').innerHTML = selected.map(cat => 
        `<a href="category.html#${encodeURIComponent(cat)}" class="tag-pill">🔥 ${cat}</a>`
      ).join('');
    }

    function getDailySeed() {
      const today = new Date();
      return today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
    }
    function seededRandom(seed) {
      const x = Math.sin(seed++) * 10000;
      return x - Math.floor(x);
    }

    let allGamesList = [];

    async function loadGames() {
      try {
        const response = await fetch('https://gamemonetize.com/feed.php?format=0&page=1');
        allGamesList = await response.json();
        renderDailyBentoGrid(allGamesList);
        renderCategoryHub();
      } catch (err) { console.error("API Error:", err); }
    }

    function renderDailyBentoGrid(games) {
      const grid = document.getElementById('bentoGrid');
      grid.innerHTML = '';
      let seed = getDailySeed();
      const sizes = ['size-1x1', 'size-1x1', 'size-2x2', 'size-2x1', 'size-1x2'];
      const shuffled = [...games].sort(() => seededRandom(seed++) - 0.5);

      shuffled.forEach((game, index) => {
        const sizeClass = sizes[Math.floor(seededRandom(seed + index) * sizes.length)];
        const card = document.createElement('a');
        card.className = `bento-item ${sizeClass}`;
        card.href = `game.html?id=${encodeURIComponent(game.id)}`;
        card.onclick = () => localStorage.setItem(`game_${game.id}`, JSON.stringify(game));

        card.innerHTML = `
          <img class="bento-img" src="${game.thumb}" alt="${game.title}" loading="lazy">
          <div class="bento-overlay">${game.title}</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderCategoryHub() {
      document.getElementById('categoryGrid').innerHTML = CATEGORIES.map(cat => {
        const match = allGamesList.find(g => g.category && g.category.toLowerCase().includes(cat.toLowerCase()));
        const thumb = match ? match.thumb : 'https://via.placeholder.com/300x150/161b22/ffffff?text=' + cat;
        return `
          <a href="category.html#${encodeURIComponent(cat)}" class="category-card">
            <img src="${thumb}" alt="${cat}">
            <span>${cat}</span>
          </a>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (!query) { renderDailyBentoGrid(allGamesList); return; }
      renderDailyBentoGrid(allGamesList.filter(g => 
        g.title.toLowerCase().includes(query) || (g.category && g.category.toLowerCase().includes(query))
      ));
    });

    renderQuickTags();
    loadGames();
  </script>
</body>
</html>
