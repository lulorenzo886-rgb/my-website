<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Play Game</title>
    <!-- 标签页 Favicon 图标（与首页 LOGO 保持一致） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Cdefs%3E%3ClinearGradient id='lulutap-main' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300F2FE'/%3E%3Cstop offset='100%25' stop-color='%239B51E0'/%3E%3C/linearGradient%3E%3ClinearGradient id='cat-warm' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FF9472'/%3E%3Cstop offset='100%25' stop-color='%23F2709C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg transform='translate(6, 4)'%3E%3Ccircle cx='26' cy='26' r='24' stroke='url(%23lulutap-main)' stroke-width='1.5' stroke-dasharray='6 3' opacity='0.4'/%3E%3Cpath d='M10 38 C10 32, 14 30, 26 30 C38 30, 42 32, 42 38 L44 42 C44 44, 42 45, 40 45 L12 45 C10 45, 8 44, 8 42 Z' fill='%231E2332' stroke='url(%23lulutap-main)' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M21 16 C21 12, 31 12, 31 16 C32 19, 31 23, 26 23 C21 23, 20 19, 21 16 Z' fill='%230F111A'/%3E%3Cpath d='M22 13 C23 10, 29 10, 30 13 C31 15, 29 16, 26 16 C23 16, 21 15, 22 13 Z' fill='url(%23lulutap-main)'/%3E%3Cpath d='M19 16 C19 10, 33 10, 33 16' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Crect x='17' y='15' width='4' height='7' rx='2' fill='url(%23lulutap-main)'/%3E%3Crect x='31' y='15' width='4' height='7' rx='2' fill='url(%23lulutap-main)'/%3E%3Cpath d='M20 24 C23 23, 29 23, 32 24 L34 33 L18 33 Z' fill='%23292D3E'/%3E%3Cg transform='translate(13, 28)'%3E%3Crect x='0' y='2' width='12' height='8' rx='3' fill='url(%23lulutap-main)'/%3E%3Ccircle cx='3' cy='5' r='1' fill='%230F111A'/%3E%3Ccircle cx='9' cy='5' r='1' fill='%23FFFFFF'/%3E%3C/g%3E%3Cg transform='translate(31, 27)'%3E%3Cpath d='M3 7 C3 4, 7 3, 9 5 C11 7, 10 12, 8 13 C6 13, 3 11, 3 7 Z' fill='url(%23cat-warm)'/%3E%3Cpath d='M4 4 L6 1 L7 4 Z' fill='url(%23cat-warm)'/%3E%3Cpath d='M7 4 L9 1 L10 4 Z' fill='url(%23cat-warm)'/%3E%3Cpath d='M9 11 C12 11, 13 8, 12 7' stroke='url(%23cat-warm)' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3C/g%3E%3Cpath d='M30 27 Q33 26 34 28' stroke='%23FFFFFF' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        /* === Global Base Styles === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* === 1. Top Header === */
        header {
            height: 64px;
            background: #161926;
            border-bottom: 1px solid #262b3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .logo:hover {
            opacity: 0.9;
        }

        .logo svg {
            display: block;
            max-height: 48px;
            width: auto;
        }

        .mode-btn {
            background: #222738;
            border: 1px solid #323950;
            color: #a0aec0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn:hover {
            color: #fff;
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* === 2. Sticky Multi-Tag Dropdown Bar === */
        .filter-wrapper {
            position: sticky;
            top: 64px;
            z-index: 90;
            background: rgba(15, 17, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222738;
            padding: 12px 24px;
        }

        .filter-container {
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .tags-dropdown-btn {
            background: #161926;
            border: 1px solid #262b3d;
            color: #00f2fe;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .tags-dropdown-btn:hover {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }

        .tags-dropdown-panel {
            position: absolute;
            top: 48px;
            left: 0;
            background: #161926;
            border: 1px solid #2a3146;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 600px;
            width: 90vw;
            z-index: 95;
            max-height: 320px;
            overflow-y: auto;
        }

        .tags-dropdown-panel.show {
            display: flex;
            animation: fadeInDown 0.2s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tag-chip {
            background: #222738;
            border: 1px solid #323950;
            color: #a0aec0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .tag-chip:hover, .tag-chip:focus {
            border-color: #00f2fe;
            color: #fff;
            outline: none;
        }

        .tag-chip.active {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            color: #00f2fe;
            font-weight: 600;
        }

        .tag-chip .close-icon {
            font-size: 11px;
            opacity: 0.7;
        }

        .clear-all-btn {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            border: 1px solid #ff4757;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: all 0.2s;
        }

        .clear-all-btn:hover {
            background: #ff4757;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        /* === 3. Top 10 Infinite Ticker Carousel === */
        .ticker-section {
            max-width: 1500px;
            width: 100%;
            margin: 20px auto 10px auto;
            padding: 0 24px;
        }

        .ticker-header {
            font-size: 14px;
            font-weight: bold;
            color: #ff4757;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ticker-container {
            width: 100%;
            overflow: hidden;
            background: #161926;
            border: 1px solid #222738;
            border-radius: 12px;
            padding: 12px 0;
            position: relative;
        }

        .ticker-track {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: marqueeScroll 25s linear infinite;
        }

        .ticker-container:hover .ticker-track,
        .ticker-container:focus-within .ticker-track {
            animation-play-state: paused;
        }

        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ticker-card {
            width: 200px;
            height: 110px;
            flex-shrink: 0;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2b3248;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .ticker-card:hover, .ticker-card:focus {
            transform: scale(1.03);
            border-color: #00f2fe;
            z-index: 2;
            outline: none;
        }

        .ticker-card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .ticker-card-overlay {
            position: relative;
            z-index: 1;
            background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0.2) 80%);
            padding: 8px;
        }

        .ticker-card-title {
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* === 4. Bento Grid Layout === */
        .main-content {
            max-width: 1500px;
            width: 100%;
            margin: 10px auto 20px auto;
            padding: 0 24px;
            flex: 1;
            transition: max-width 0.3s ease;
        }

        body.mobile-mode .main-content,
        body.mobile-mode .ticker-section {
            max-width: 480px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            grid-auto-flow: dense;
        }

        body.mobile-mode .bento-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            position: relative;
            background: #161926;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222738;
            text-decoration: none;
            color: #fff;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            cursor: pointer;
        }

        .game-card:hover, .game-card:focus {
            transform: translateY(-5px);
            border-color: #00f2fe;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.25);
            z-index: 2;
            outline: none;
        }

        .game-card.featured {
            grid-column: span 2;
            grid-row: span 2;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
        }

        body.mobile-mode .game-card.featured {
            grid-column: span 2;
            grid-row: span 1;
            aspect-ratio: 16 / 9;
        }

        .card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s;
        }

        .game-card:hover .card-cover,
        .game-card:focus .card-cover {
            transform: scale(1.05);
        }

        .card-overlay {
            position: relative;
            z-index: 1;
            background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0.4) 70%, rgba(15,17,26,0) 100%);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .featured .card-title {
            font-size: 18px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #a0aec0;
            margin-top: 2px;
        }

        .card-tag {
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .card-like-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 600;
            color: #a0aec0;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }

        .card-like-badge.liked {
            color: #ff4757;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #323950;
            border-top: 2px solid #00f2fe;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* === 5. Footer Styles === */
        .site-footer {
            background: #161926;
            border-top: 1px solid #222738;
            padding: 28px 0;
            margin-top: auto;
            text-align: center;
            color: #a0aec0;
            font-size: 13px;
        }

        .footer-container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-links a {
            color: #a0aec0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #00f2fe;
            text-decoration: underline;
        }

        .footer-links .divider {
            color: #323950;
            font-size: 10px;
        }

        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .game-card.featured {
                grid-column: span 2;
                grid-row: span 1;
                aspect-ratio: 16 / 9;
            }

            .filter-wrapper, .ticker-section, .main-content {
                padding: 0 12px;
            }

            .logo svg {
                max-height: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Top Header with SVG Logo -->
    <header>
        <a href="index.html" class="logo" aria-label="LuluTap Homepage">
            <svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">

        <button class="mode-btn" id="mode-btn" onclick="toggleDeviceMode()" aria-label="Switch Device View Mode">💻 PC Mode</button>

    <!-- 2. Sticky Multi-Tag Dropdown Bar -->
    <div class="filter-wrapper">
        <div class="filter-container">
            <div>
                <button class="tags-dropdown-btn" id="tags-btn" onclick="toggleTagsDropdown(event)" aria-expanded="false" aria-label="Toggle Tags Filter Menu">
                    <span>🏷️ Tags</span>
                    <span id="dropdown-arrow">▾</span>
                </button>
                <div class="tags-dropdown-panel" id="tags-panel" role="region" aria-label="Tag Filter Panel"></div>

            <button class="clear-all-btn" id="clear-all-btn" onclick="clearAllFilters()" aria-label="Clear All Selected Filters">✕ Clear All</button>
        </div>
    </div>

    <!-- 3. Top 10 Trending Games Infinite Ticker Carousel -->
    <section class="ticker-section" aria-label="Trending Games Carousel">
        <div class="ticker-header">🔥 Top 10 Trending Games</div>
        <div class="ticker-container">
            <div class="ticker-track" id="ticker-track"></div>
        </div>
    </section>

    <!-- 4. Main Bento Game Grid -->
    <main class="main-content">
        <div class="bento-grid" id="game-grid" role="region" aria-label="Game Grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #a0aec0;">
                <div class="spinner" style="margin: 0 auto 12px auto; width: 24px; height: 24px;"></div>
                Loading 100 games...
            </div>
        </div>
    </main>

    <!-- 5. Footer 页脚区域 -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>© 2026 LuluTap. All rights reserved.</p>
            <div class="footer-links">
                <a href="contact.html">Contact Us</a>
                <span class="divider">•</span>
                <a href="privacy.html">Privacy Policy</a>
                <span class="divider">•</span>
                <a href="terms.html">Terms of Service</a>
                <span class="divider">•</span>
                <a href="dmca.html">DMCA Policy</a>
            </div>
        </div>
    </footer>

    <script>
        let allCategories = ["🔥 All", "Action", "Arcade", "Puzzle", "Racing", "Shooting", "Casual", "Strategy", "Sports"];
        let selectedTags = [];
        let gamesData = []; 
        let isMobileMode = false;
        const TARGET_GAME_COUNT = 100; 

        const extraTagsPool = ["🔥 Hot", "⚡ Fast", "🎮 3D", "🏆 Top", "⭐ Popular", "🕹️ Classic", "🎯 Skill"];

        const mockFallbackGames = Array.from({ length: 100 }).map((_, i) => ({
            id: `fallback-${i}`,
            title: `Popular Game ${i + 1}`,
            category: ["Action", "Arcade", "Puzzle", "Racing", "Shooting"][i % 5],
            thumb: `https://picsum.photos/seed/${i + 100}/400/400`,
            url: "https://html5.gamedistribution.com/rvvAS30838184/",
            description: "An exciting browser action game designed for ultimate fun and challenge."
        }));

        /* ==================== 点赞核心算法与获取 ==================== */
        function getSeedCount(title) {
            let hash = 0;
            for (let i = 0; i < title.length; i++) {
                hash = title.charCodeAt(i) + ((hash << 5) - hash);
            }
            return (Math.abs(hash) % 380) + 120;
        }

        function getGameLikesRecord(title) {
            const cleanTitle = (title || '').trim();
            const likesStore = JSON.parse(localStorage.getItem('lulutap_likes') || '{}');
            
            if (!likesStore[cleanTitle]) {
                likesStore[cleanTitle] = {
                    count: getSeedCount(cleanTitle),
                    userLiked: false
                };
                localStorage.setItem('lulutap_likes', JSON.stringify(likesStore));
            }
            return likesStore[cleanTitle];
        }
        /* ========================================================== */

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function toggleDeviceMode() {
            isMobileMode = !isMobileMode;
            const btn = document.getElementById('mode-btn');
            if (isMobileMode) {
                document.body.classList.add('mobile-mode');
                btn.innerHTML = '📱 Mobile Mode';
            } else {
                document.body.classList.remove('mobile-mode');
                btn.innerHTML = '💻 PC Mode';
            }
        }

        function toggleTagsDropdown(e) {
            e.stopPropagation();
            const panel = document.getElementById('tags-panel');
            const btn = document.getElementById('tags-btn');
            const arrow = document.getElementById('dropdown-arrow');
            const isOpen = panel.classList.contains('show');

            if (isOpen) {
                panel.classList.remove('show');
                arrow.innerText = '▾';
                btn.setAttribute('aria-expanded', 'false');
            } else {
                panel.classList.add('show');
                arrow.innerText = '▴';
                btn.setAttribute('aria-expanded', 'true');
            }
        }

        document.addEventListener('click', (e) => {
            const panel = document.getElementById('tags-panel');
            const btn = document.getElementById('tags-btn');
            if (panel && !panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.remove('show');
                document.getElementById('dropdown-arrow').innerText = '▾';
                btn.setAttribute('aria-expanded', 'false');
            }
        });

        function goToGame(game) {
            if (!game) return;
            let history = JSON.parse(localStorage.getItem('lulutap_recent') || '[]');
            history = history.filter(item => item.title !== game.title);
            history.unshift(game);
            if (history.length > 20) history.pop();
            localStorage.setItem('lulutap_recent', JSON.stringify(history));

            const query = new URLSearchParams({
                url: game.gameUrl,
                title: game.title,
                img: game.img || '',
                cat: game.category || 'Arcade',
                desc: game.description || 'Enjoy playing ' + game.title + ' on LuluTap!'
            }).toString();

            window.location.href = `game.html?${query}`;
        }

        function handleKeyPress(e, callback) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                callback();
            }
        }

        // 一次性抓取/汇总 100 款游戏数据
        async function fetch100Games() {
            let fetchedList = [];
            let page = 1;

            try {
                while (fetchedList.length < TARGET_GAME_COUNT && page <= 5) {
                    const response = await fetch(`https://gamemonetize.com/feed.php?format=0&page=${page}`);
                    if (!response.ok) break;
                    const data = await response.json();
                    if (!Array.isArray(data) || data.length === 0) break;
                    
                    fetchedList = fetchedList.concat(data);
                    page++;
                }
            } catch (e) {
                console.warn("API Fetch Failed/CORS limit, fallbacking to simulated mock data.", e);
            }

            if (fetchedList.length < TARGET_GAME_COUNT) {
                fetchedList = fetchedList.concat(mockFallbackGames.slice(0, TARGET_GAME_COUNT - fetchedList.length));
            }

            return shuffle(fetchedList.slice(0, TARGET_GAME_COUNT));
        }

        async function initGameData() {
            try {
                const rawList = await fetch100Games();

                gamesData = rawList.map((item) => {
                    const catName = item.category || "Other";
                    
                    if (!allCategories.includes(catName)) {
                        allCategories.push(catName);
                    }

                    const gameTags = [catName]; 
                    const shuffledExtra = shuffle([...extraTagsPool]);
                    gameTags.push(shuffledExtra[0]);
                    if (Math.random() > 0.5) {
                        gameTags.push(shuffledExtra[1]);
                    }

                    return {
                        id: item.id || `game-${Math.random()}`,
                        title: item.title || item.name || "Untitled Game",
                        category: catName,
                        tags: gameTags,
                        img: item.thumb || 'https://via.placeholder.com/300',
                        gameUrl: item.url || '#',
                        description: item.description || ''
                    };
                });

                renderTop10Ticker(gamesData.slice(0, 10));
                assignFeaturedCards();
                renderTags();
                renderGames();
            } catch (err) {
                console.error("Critical Execution Error:", err);
            }
        }

        function assignFeaturedCards() {
            let nextFeaturedIndex = 0;
            
            gamesData.forEach((game, idx) => {
                if (idx === nextFeaturedIndex) {
                    game.featured = true;
                    nextFeaturedIndex += Math.floor(Math.random() * 3) + 7; 
                } else {
                    game.featured = false;
                }
            });
        }

        function renderTop10Ticker(top10List) {
            const track = document.getElementById('ticker-track');
            if (!top10List || top10List.length === 0) return;

            const listToRender = [...top10List, ...top10List];

            track.innerHTML = listToRender.map((game, index) => {
                const originalIndex = index % top10List.length;
                return `
                <div class="ticker-card" tabindex="0" role="button" aria-label="${game.title}" onclick="goToGame(gamesData[${originalIndex}])" onkeydown="handleKeyPress(event, () => goToGame(gamesData[${originalIndex}]))">
                    <div class="ticker-card-cover" style="background-image: url('${game.img}');"></div>
                    <div class="ticker-card-overlay">
                        <div class="ticker-card-title">${game.title}</div>
                    </div>
                </div>
            `}).join('');
        }

        function renderTags() {
            const container = document.getElementById('tags-panel');
            const clearBtn = document.getElementById('clear-all-btn');
            const btnText = document.querySelector('.tags-dropdown-btn span');

            container.innerHTML = allCategories.map(cat => {
                const isAll = cat === "🔥 All";
                const isSelected = isAll ? selectedTags.length === 0 : selectedTags.includes(cat);
                
                return `
                    <div class="tag-chip ${isSelected ? 'active' : ''}" tabindex="0" role="button" aria-label="Filter tag ${cat}" onclick="toggleTag('${cat}')" onkeydown="handleKeyPress(event, () => toggleTag('${cat}'))">
                        <span>${cat}</span>
                        ${!isAll && isSelected ? '<span class="close-icon">✕</span>' : ''}
                    </div>
                `;
            }).join('');

            if (selectedTags.length > 0) {
                btnText.innerText = `🏷️ Tags (${selectedTags.length})`;
            } else {
                btnText.innerText = `🏷️ Tags`;
            }

            clearBtn.style.display = selectedTags.length >= 1 ? 'block' : 'none';
        }

        function toggleTag(cat) {
            if (cat === "🔥 All") {
                selectedTags = [];
            } else {
                if (selectedTags.includes(cat)) {
                    selectedTags = selectedTags.filter(t => t !== cat);
                } else {
                    selectedTags.push(cat);
                }
            }
            renderTags();
            renderGames();
        }

        function clearAllFilters() {
            selectedTags = [];
            renderTags();
            renderGames();
        }

        function renderGames() {
            const grid = document.getElementById('game-grid');
            
            const filtered = gamesData.filter(game => {
                if (selectedTags.length === 0) return true;
                return selectedTags.some(tag => game.tags.includes(tag));
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #a0aec0;">No matching games found. Try resetting filters!</div>`;
                return;
            }

            grid.innerHTML = filtered.map((game) => {
                const realIndex = gamesData.indexOf(game);
                const likeRecord = getGameLikesRecord(game.title);

                return `
                <div tabindex="0" onclick="goToGame(gamesData[${realIndex}])" onkeydown="handleKeyPress(event, () => goToGame(gamesData[${realIndex}]))" class="game-card ${game.featured ? 'featured' : ''}" role="button" aria-label="${game.title}">
                    <div class="card-cover" style="background-image: url('${game.img}');"></div>
                    <div class="card-overlay">
                        <div class="card-title">${game.title}</div>
                        <div class="card-meta">
                            <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                                ${game.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                            </div>
                            <div class="card-like-badge ${likeRecord.userLiked ? 'liked' : ''}">
                                ${likeRecord.userLiked ? '❤️' : '🤍'} ${likeRecord.count}
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        /* === 主页返回/获取焦点时强制刷新 UI === */
        window.addEventListener('pageshow', () => {
            if (gamesData.length > 0) {
                renderGames();
            }
        });

        /* === 跨标签页实时同步点赞 === */
        window.addEventListener('storage', (e) => {
            if (e.key === 'lulutap_likes') {
                renderGames();
            }
        });

        // 初始化执行
        renderTags();
        initGameData();
    </script>
</body>
</html>
