<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Discover Fun Games</title>
    <style>
        /* === Global Base Styles === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* === 1. Top Header === */
        header {
            height: 60px;
            background: #161926;
            border-bottom: 1px solid #262b3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #00f2fe;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .logo:hover {
            opacity: 0.9;
        }

        .mode-btn {
            background: #222738;
            border: 1px solid #323950;
            color: #a0aec0;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            color: #fff;
            border-color: #00f2fe;
        }

        /* === 2. Sticky Multi-Tag Filter Bar === */
        .filter-wrapper {
            position: sticky;
            top: 60px;
            z-index: 90;
            background: rgba(15, 17, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222738;
            padding: 12px 24px;
        }

        .filter-container {
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .tags-scroll-group {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .tags-scroll-group::-webkit-scrollbar {
            display: none;
        }

        .tag-chip {
            background: #161926;
            border: 1px solid #262b3d;
            color: #a0aec0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .tag-chip:hover {
            border-color: #00f2fe;
            color: #fff;
        }

        /* Active Tag Highlight */
        .tag-chip.active {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            color: #00f2fe;
            font-weight: 600;
        }

        .tag-chip .close-icon {
            font-size: 11px;
            opacity: 0.7;
        }

        .tag-chip .close-icon:hover {
            opacity: 1;
        }

        /* Clear All Button */
        .clear-all-btn {
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            display: none;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
        }

        .clear-all-btn:hover {
            transform: scale(1.05);
        }

        /* === 3. Bento Grid Layout === */
        .main-content {
            max-width: 1500px;
            width: 100%;
            margin: 20px auto;
            padding: 0 24px;
            flex: 1;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            grid-auto-flow: dense;
        }

        .game-card {
            position: relative;
            background: #161926;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222738;
            text-decoration: none;
            color: #fff;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f2fe;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.2);
            z-index: 2;
        }

        /* Bento Featured Card (2x2 Grid Span) */
        .game-card.featured {
            grid-column: span 2;
            grid-row: span 2;
            aspect-ratio: 1 / 1;
        }

        .card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s;
        }

        .game-card:hover .card-cover {
            transform: scale(1.05);
        }

        .card-overlay {
            position: relative;
            z-index: 1;
            background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0.4) 70%, rgba(15,17,26,0) 100%);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .featured .card-title {
            font-size: 18px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #a0aec0;
        }

        .card-tag {
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }

        .card-likes {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #ff4757;
            font-weight: bold;
        }

        .load-more-container {
            text-align: center;
            margin: 40px 0;
        }

        .load-more-btn {
            background: #222738;
            border: 1px solid #323950;
            color: #00f2fe;
            padding: 10px 28px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:hover {
            background: #00f2fe;
            color: #000;
        }

        /* === 4. Responsive Mobile Adaptation === */
        @media (max-width: 1024px) {
            .bento-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .game-card.featured {
                grid-column: span 2;
                grid-row: span 1;
                aspect-ratio: 16 / 9;
            }

            .filter-wrapper {
                padding: 10px 12px;
            }

            .main-content {
                padding: 0 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Top Header -->
    <header>
        <a href="index.html" class="logo">🕹️ LuluTap</a>
        <button class="mode-btn" id="mode-btn">💻 PC Mode</button>
    </header>

    <!-- 2. Sticky Multi-Tag Filter Bar -->
    <div class="filter-wrapper">
        <div class="filter-container">
            <div class="tags-scroll-group" id="tags-group"></div>
            <button class="clear-all-btn" id="clear-all-btn" onclick="clearAllFilters()">✕ Clear All</button>
        </div>
    </div>

    <!-- 3. Main Bento Game Grid -->
    <main class="main-content">
        <div class="bento-grid" id="game-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #a0aec0;">
                ⏳ Loading games list from GameMonetize...
            </div>
        </div>

        <div class="load-more-container">
            <button class="load-more-btn" onclick="loadMoreGames()">🔄 Load More Games</button>
        </div>
    </main>

    <script>
        let allCategories = ["🔥 All"];
        let selectedTags = [];
        let gamesData = []; 
        let currentPage = 1;

        // Fetch data from GameMonetize API
        async function initGameData(page = 1) {
            const grid = document.getElementById('game-grid');
            if (page === 1) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #a0aec0;">⏳ Loading GameMonetize games...</div>`;
            }

            try {
                // Request GameMonetize API
                const response = await fetch(`https://gamemonetize.com/feed.php?format=0&page=${page}`);
                if (!response.ok) throw new Error("HTTP error " + response.status);
                const data = await response.json();

                // Parse and format data structure
                const rawList = Array.isArray(data) ? data : [];
                
                const formattedGames = rawList.map((item, idx) => {
                    const catName = item.category || "Other";
                    
                    // Collect categories dynamically
                    if (!allCategories.includes(catName)) {
                        allCategories.push(catName);
                    }

                    return {
                        id: item.id,
                        title: item.title || item.name || "Untitled Game",
                        category: catName,
                        tags: [catName],
                        likes: (Math.floor(Math.random() * 20) / 10 + 3.0).toFixed(1) + "k", // Random simulated likes
                        img: item.thumb, // API Cover Thumbnail
                        gameUrl: item.url, // Game Frame URL
                        featured: (page === 1 && idx === 0) // First card on page 1 featured as 2x2 Bento card
                    };
                });

                if (page === 1) {
                    gamesData = formattedGames;
                } else {
                    gamesData = [...gamesData, ...formattedGames];
                }

                renderTags();
                renderGames();
            } catch (err) {
                console.error("API Fetch Error:", err);
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #ff4757;">
                        ⚠️ Failed to load games! If running locally, your browser might be blocking cross-origin requests (CORS).<br>
                        Please preview via VSCode <b>Live Server</b>, or deploy directly to <b>GitHub Pages</b>.
                    </div>`;
            }
        }

        // Render Tag Bar
        function renderTags() {
            const container = document.getElementById('tags-group');
            const clearBtn = document.getElementById('clear-all-btn');

            container.innerHTML = allCategories.map(cat => {
                const isAll = cat === "🔥 All";
                const isSelected = isAll ? selectedTags.length === 0 : selectedTags.includes(cat);
                
                return `
                    <div class="tag-chip ${isSelected ? 'active' : ''}" onclick="toggleTag('${cat}')">
                        <span>${cat}</span>
                        ${!isAll && isSelected ? '<span class="close-icon">✕</span>' : ''}
                    </div>
                `;
            }).join('');

            clearBtn.style.display = selectedTags.length >= 2 ? 'block' : 'none';
        }

        // Tag Toggle Logic
        function toggleTag(cat) {
            if (cat === "🔥 All") {
                selectedTags = [];
            } else {
                if (selectedTags.includes(cat)) {
                    selectedTags = selectedTags.filter(t => t !== cat);
                } else {
                    selectedTags.push(cat);
                }
            }
            renderTags();
            renderGames();
        }

        // Reset Filter Tags
        function clearAllFilters() {
            selectedTags = [];
            renderTags();
            renderGames();
        }

        // Render Game Grid
        function renderGames() {
            const grid = document.getElementById('game-grid');
            
            const filtered = gamesData.filter(game => {
                if (selectedTags.length === 0) return true;
                return selectedTags.every(tag => game.tags.includes(tag));
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: #a0aec0;">No matching games found. Try resetting the filters!</div>`;
                return;
            }

            // Pass encoded game URL and Title to game.html
            grid.innerHTML = filtered.map(game => `
                <a href="game.html?url=${encodeURIComponent(game.gameUrl)}&title=${encodeURIComponent(game.title)}" class="game-card ${game.featured ? 'featured' : ''}">
                    <div class="card-cover" style="background-image: url('${game.img}');"></div>
                    <div class="card-overlay">
                        <div class="card-title">${game.title}</div>
                        <div class="card-meta">
                            <span class="card-tag">${game.category}</span>
                            <span class="card-likes">👍 ${game.likes}</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        // Load Next Page of API Games
        function loadMoreGames() {
            currentPage++;
            initGameData(currentPage);
        }

        // Initialize Page Data
        initGameData();
    </script>
</body>
</html>
