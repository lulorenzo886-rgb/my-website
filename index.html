<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Play Game</title>
    <!-- Favicon 图标 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Cdefs%3E%3ClinearGradient id='lulutap-main' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300F2FE'/%3E%3Cstop offset='100%25' stop-color='%239B51E0'/%3E%3C/linearGradient%3E%3ClinearGradient id='cat-warm' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23FF9472'/%3E%3Cstop offset='100%25' stop-color='%23F2709C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg transform='translate(6, 4)'%3E%3Ccircle cx='26' cy='26' r='24' stroke='url(%23lulutap-main)' stroke-width='1.5' stroke-dasharray='6 3' opacity='0.4'/%3E%3Cpath d='M10 38 C10 32, 14 30, 26 30 C38 30, 42 32, 42 38 L44 42 C44 44, 42 45, 40 45 L12 45 C10 45, 8 44, 8 42 Z' fill='%231E2332' stroke='url(%23lulutap-main)' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M21 16 C21 12, 31 12, 31 16 C32 19, 31 23, 26 23 C21 23, 20 19, 21 16 Z' fill='%230F111A'/%3E%3Cpath d='M22 13 C23 10, 29 10, 30 13 C31 15, 29 16, 26 16 C23 16, 21 15, 22 13 Z' fill='url(%23lulutap-main)'/%3E%3Cpath d='M19 16 C19 10, 33 10, 33 16' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Crect x='17' y='15' width='4' height='7' rx='2' fill='url(%23lulutap-main)'/%3E%3Crect x='31' y='15' width='4' height='7' rx='2' fill='url(%23lulutap-main)'/%3E%3Cpath d='M20 24 C23 23, 29 23, 32 24 L34 33 L18 33 Z' fill='%23292D3E'/%3E%3Cg transform='translate(13, 28)'%3E%3Crect x='0' y='2' width='12' height='8' rx='3' fill='url(%23lulutap-main)'/%3E%3Ccircle cx='3' cy='5' r='1' fill='%230F111A'/%3E%3Ccircle cx='9' cy='5' r='1' fill='%23FFFFFF'/%3E%3C/g%3E%3Cg transform='translate(31, 27)'%3E%3Cpath d='M3 7 C3 4, 7 3, 9 5 C11 7, 10 12, 8 13 C6 13, 3 11, 3 7 Z' fill='url(%23cat-warm)'/%3E%3Cpath d='M4 4 L6 1 L7 4 Z' fill='url(%23cat-warm)'/%3E%3Cpath d='M7 4 L9 1 L10 4 Z' fill='url(%23cat-warm)'/%3E%3Cpath d='M9 11 C12 11, 13 8, 12 7' stroke='url(%23cat-warm)' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3C/g%3E%3Cpath d='M30 27 Q33 26 34 28' stroke='%23FFFFFF' stroke-width='1.5' stroke-linecap='round' fill='none'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* === Header === */
        header {
            height: 64px;
            background: #161926;
            border-bottom: 1px solid #262b3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo svg {
            display: block;
            max-height: 48px;
            width: auto;
        }

        .mode-btn {
            background: #222738;
            border: 1px solid #323950;
            color: #a0aec0;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .mode-btn:hover {
            color: #fff;
            border-color: #00f2fe;
        }

        /* === Sticky Quick Tags Bar === */
        .filter-wrapper {
            position: sticky;
            top: 64px;
            z-index: 90;
            background: rgba(15, 17, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222738;
            padding: 12px 24px;
        }

        .tags-scroll-container {
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tags-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .tag-chip {
            background: #222738;
            border: 1px solid #323950;
            color: #a0aec0;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tag-chip:hover {
            border-color: #00f2fe;
            color: #fff;
        }

        /* === Main Content === */
        .main-content {
            max-width: 1500px;
            width: 100%;
            margin: 20px auto;
            padding: 0 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        body.mobile-mode .main-content {
            max-width: 480px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* === Poki Top Bento Grid === */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            grid-auto-flow: dense;
        }

        body.mobile-mode .bento-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* === Category Horizontal Rows === */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
        }

        body.mobile-mode .category-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .game-card {
            position: relative;
            background: #161926;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222738;
            color: #fff;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00f2fe;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.25);
            z-index: 2;
        }

        .game-card.featured {
            grid-column: span 2;
            grid-row: span 2;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
        }

        body.mobile-mode .game-card.featured {
            grid-column: span 2;
            grid-row: span 1;
            aspect-ratio: 16 / 9;
        }

        .card-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s;
        }

        .game-card:hover .card-cover {
            transform: scale(1.05);
        }

        .card-overlay {
            position: relative;
            z-index: 1;
            background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0.4) 70%, rgba(15,17,26,0) 100%);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .featured .card-title {
            font-size: 18px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #a0aec0;
            margin-top: 2px;
        }

        .card-tag {
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .card-like-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 600;
            color: #a0aec0;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 10px;
        }

        .card-like-badge.liked {
            color: #ff4757;
        }

        /* === Footer === */
        .site-footer {
            background: #161926;
            border-top: 1px solid #222738;
            padding: 28px 0;
            margin-top: auto;
            text-align: center;
            color: #a0aec0;
            font-size: 13px;
        }

        .footer-container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .footer-links a {
            color: #a0aec0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #00f2fe;
            text-decoration: underline;
        }

        .footer-links .divider {
            color: #323950;
            font-size: 10px;
        }

        @media (max-width: 1024px) {
            .bento-grid, .category-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .bento-grid, .category-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo">
            <svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="lulutap-main" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00F2FE" />
                        <stop offset="100%" stop-color="#9B51E0" />
                    </linearGradient>
                    <linearGradient id="cat-warm" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FF9472" />
                        <stop offset="100%" stop-color="#F2709C" />
                    </linearGradient>
                </defs>
                <g transform="translate(6, 4)">
                    <circle cx="26" cy="26" r="24" stroke="url(#lulutap-main)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.4" />
                    <path d="M10 38 C10 32, 14 30, 26 30 C38 30, 42 32, 42 38 L44 42 C44 44, 42 45, 40 45 L12 45 C10 45, 8 44, 8 42 Z" fill="#1E2332" stroke="url(#lulutap-main)" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M21 16 C21 12, 31 12, 31 16 C32 19, 31 23, 26 23 C21 23, 20 19, 21 16 Z" fill="#0F111A"/>
                    <path d="M22 13 C23 10, 29 10, 30 13 C31 15, 29 16, 26 16 C23 16, 21 15, 22 13 Z" fill="url(#lulutap-main)"/>
                    <path d="M19 16 C19 10, 33 10, 33 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
                    <rect x="17" y="15" width="4" height="7" rx="2" fill="url(#lulutap-main)"/>
                    <rect x="31" y="15" width="4" height="7" rx="2" fill="url(#lulutap-main)"/>
                    <path d="M20 24 C23 23, 29 23, 32 24 L34 33 L18 33 Z" fill="#292D3E"/>
                    <g transform="translate(13, 28)">
                        <rect x="0" y="2" width="12" height="8" rx="3" fill="url(#lulutap-main)"/>
                        <circle cx="3" cy="5" r="1" fill="#0F111A"/>
                        <circle cx="9" cy="5" r="1" fill="#FFFFFF"/>
                    </g>
                    <g transform="translate(31, 27)">
                        <path d="M3 7 C3 4, 7 3, 9 5 C11 7, 10 12, 8 13 C6 13, 3 11, 3 7 Z" fill="url(#cat-warm)"/>
                        <path d="M4 4 L6 1 L7 4 Z" fill="url(#cat-warm)"/>
                        <path d="M7 4 L9 1 L10 4 Z" fill="url(#cat-warm)"/>
                        <path d="M9 11 C12 11, 13 8, 12 7" stroke="url(#cat-warm)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                    </g>
                    <path d="M30 27 Q33 26 34 28" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                </g>
                <text x="64" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="0.8">
                    <tspan fill="url(#lulutap-main)">Lulu</tspan>
                    <tspan fill="#FFFFFF">Tap</tspan>
                </text>
            </svg>
        </a>
        <button class="mode-btn" id="mode-btn" onclick="toggleDeviceMode()">💻 PC Mode</button>
    </header>

    <!-- Category Bar -->
    <div class="filter-wrapper">
        <div class="tags-scroll-container" id="tags-bar"></div>
    </div>

    <!-- Layout Container -->
    <main class="main-content" id="main-content">
        <div style="text-align: center; padding: 80px; color: #a0aec0;">
            Loading all games catalog...
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>© 2026 LuluTap. All rights reserved.</p>
            <div class="footer-links">
                <a href="contact.html">Contact Us</a>
                <span class="divider">•</span>
                <a href="privacy.html">Privacy Policy</a>
                <span class="divider">•</span>
                <a href="terms.html">Terms of Service</a>
                <span class="divider">•</span>
                <a href="dmca.html">DMCA Policy</a>
            </div>
        </div>
    </footer>

    <script>
        let allGamesData = [];
        let isMobileMode = false;
        const mainCategories = ["Action", "Arcade", "Puzzle", "Racing", "Shooting", "Casual", "Strategy", "Sports"];

        function toggleDeviceMode() {
            isMobileMode = !isMobileMode;
            const btn = document.getElementById('mode-btn');
            if (isMobileMode) {
                document.body.classList.add('mobile-mode');
                btn.innerHTML = '📱 Mobile Mode';
            } else {
                document.body.classList.remove('mobile-mode');
                btn.innerHTML = '💻 PC Mode';
            }
        }

        function getSeedCount(title) {
            let hash = 0;
            for (let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
            return (Math.abs(hash) % 380) + 120;
        }

        function getGameLikesRecord(title) {
            const cleanTitle = (title || '').trim();
            const likesStore = JSON.parse(localStorage.getItem('lulutap_likes') || '{}');
            if (!likesStore[cleanTitle]) {
                likesStore[cleanTitle] = { count: getSeedCount(cleanTitle), userLiked: false };
                localStorage.setItem('lulutap_likes', JSON.stringify(likesStore));
            }
            return likesStore[cleanTitle];
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function goToGame(game) {
            if (!game) return;
            const query = new URLSearchParams({
                url: game.gameUrl,
                title: game.title,
                img: game.img || '',
                cat: game.category || 'Arcade',
                desc: game.description || 'Enjoy playing ' + game.title + ' on LuluTap!'
            }).toString();
            window.location.href = `game.html?${query}`;
        }

        // 批量全量拉取游戏（抓取多页数据，保证覆盖数千款游戏）
        async function fetchAllGames() {
            let fetchedList = [];
            let maxPages = 15; // 抓取多页获取大容量游戏库

            try {
                for (let p = 1; p <= maxPages; p++) {
                    const res = await fetch(`https://gamemonetize.com/feed.php?format=0&page=${p}`);
                    if (!res.ok) break;
                    const data = await res.json();
                    if (!Array.isArray(data) || data.length === 0) break;
                    fetchedList = fetchedList.concat(data);
                }
            } catch (e) {
                console.warn("API load error, fallback to initial dataset.", e);
            }

            return fetchedList;
        }

        async function initPokiLayout() {
            const rawList = await fetchAllGames();
            
            allGamesData = rawList.map((item, idx) => ({
                id: item.id || `game-${idx}`,
                title: item.title || item.name || "Untitled Game",
                category: item.category || "Casual",
                img: item.thumb || 'https://via.placeholder.com/300',
                gameUrl: item.url || '#',
                description: item.description || ''
            }));

            renderCategoryBar();
            renderPokiHome();
        }

        function renderCategoryBar() {
            const bar = document.getElementById('tags-bar');
            bar.innerHTML = `
                <div class="tag-chip" onclick="scrollToSection('featured-section')">🔥 Hot Featured</div>
                ${mainCategories.map(cat => `
                    <div class="tag-chip" onclick="scrollToSection('cat-${cat}')">${cat}</div>
                `).join('')}
            `;
        }

        function scrollToSection(id) {
            const target = document.getElementById(id);
            if (target) {
                const offset = 130; // 考虑 Header 和 Tag 栏的高度的偏移值
                const bodyRect = document.body.getBoundingClientRect().top;
                const elementRect = target.getBoundingClientRect().top;
                const elementPosition = elementRect - bodyRect;
                const offsetPosition = elementPosition - offset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }
        }

        function createCardHTML(game, isFeatured = false) {
            const likeRecord = getGameLikesRecord(game.title);
            return `
                <div class="game-card ${isFeatured ? 'featured' : ''}" onclick='goToGame(${JSON.stringify(game).replace(/'/g, "&apos;")})'>
                    <div class="card-cover" style="background-image: url('${game.img}');"></div>
                    <div class="card-overlay">
                        <div class="card-title">${game.title}</div>
                        <div class="card-meta">
                            <span class="card-tag">${game.category}</span>
                            <div class="card-like-badge ${likeRecord.userLiked ? 'liked' : ''}">
                                ${likeRecord.userLiked ? '❤️' : '🤍'} ${likeRecord.count}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPokiHome() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            // 1. 顶部 Featured 热门展台 (前 18 款游戏混合大卡片)
            const topFeatured = allGamesData.slice(0, 18);
            let bentoHTML = `
                <section id="featured-section">
                    <div class="section-title">🔥 Featured Games</div>
                    <div class="bento-grid">
            `;

            topFeatured.forEach((game, idx) => {
                // 每隔几个卡片插入一个放大卡片
                const isBig = (idx === 0 || idx === 7 || idx === 12);
                bentoHTML += createCardHTML(game, isBig);
            });

            bentoHTML += `</div></section>`;
            container.innerHTML += bentoHTML;

            // 2. 按各个分类分类展示（只取包含该分类的游戏）
            mainCategories.forEach(cat => {
                const catGames = allGamesData.filter(g => g.category.toLowerCase().includes(cat.toLowerCase())).slice(0, 12);
                
                if (catGames.length > 0) {
                    let catHTML = `
                        <section id="cat-${cat}">
                            <div class="section-title">🎮 ${cat} Games</div>
                            <div class="category-grid">
                                ${catGames.map(game => createCardHTML(game, false)).join('')}
                            </div>
                        </section>
                    `;
                    container.innerHTML += catHTML;
                }
            });
        }

        window.addEventListener('pageshow', () => {
            if (allGamesData.length > 0) renderPokiHome();
        });

        initPokiLayout();
    </script>
</body>
</html>
