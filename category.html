<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Games - LuluTap</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f111a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { height: 64px; background: #161926; border-bottom: 1px solid #262b3d; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: #00f2fe; text-decoration: none; }
        
        .container { max-width: 1500px; width: 100%; margin: 0 auto; padding: 24px; flex: 1; }
        .breadcrumb { font-size: 13px; color: #a0aec0; margin-bottom: 16px; }
        .breadcrumb a { color: #00f2fe; text-decoration: none; }

        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .category-title { font-size: 24px; font-weight: 800; }
        .sort-select { background: #161926; border: 1px solid #262b3d; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; outline: none; cursor: pointer; }

        .bento-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .game-card { height: 180px; position: relative; background: #161926; border-radius: 12px; overflow: hidden; border: 1px solid #222738; text-decoration: none; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; transition: transform 0.2s, border-color 0.2s; cursor: pointer; }
        .game-card:hover { transform: translateY(-4px); border-color: #00f2fe; }
        .card-cover { position: absolute; top:0; left:0; width:100%; height:100%; background-size: cover; background-position: center; }
        .card-overlay { position: relative; z-index: 1; background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0) 100%); padding: 10px; }
        .card-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .loading-trigger { text-align: center; padding: 40px; color: #a0aec0; font-size: 14px; }

        footer { background: #161926; border-top: 1px solid #262b3d; padding: 32px 24px; text-align: center; margin-top: auto; }
        .footer-links { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
        .footer-link { color: #a0aec0; text-decoration: none; font-size: 13px; }
        .footer-link:hover { color: #00f2fe; }
        .footer-copyright { font-size: 12px; color: #718096; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">LuluTap</a>
    </header>

    <div class="container">
        <div class="breadcrumb">
            <a href="index.html">← Back to Home</a> / <span id="bread-cat">Category</span>
        </div>

        <div class="toolbar">
            <h1 class="category-title" id="cat-heading">Category Games</h1>
            <select class="sort-select" id="sort-select" onchange="changeSort(this.value)">
                <option value="popular">🔥 Most Popular</option>
                <option value="newest">🆕 Newest</option>
                <option value="az">🔤 A - Z</option>
            </select>
        </div>

        <div class="bento-grid" id="grid"></div>
        <div class="loading-trigger" id="loading-trigger">Loading games...</div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="privacy.html" class="footer-link">Privacy Policy</a>
            <a href="terms.html" class="footer-link">Terms of Service</a>
            <a href="dmca.html" class="footer-link">DMCA Policy</a>
            <a href="contact.html" class="footer-link">Contact Us</a>
        </div>
        <div class="footer-copyright">© 2026 LuluTap. All rights reserved.</div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentCategory = urlParams.get('type') || 'Action';
        
        let rawCategoryGames = [];
        let sortedGames = [];
        let displayCount = 20;

        document.getElementById('bread-cat').innerText = currentCategory;
        document.getElementById('cat-heading').innerText = `${currentCategory} Games`;

        function saveAndGo(game) {
            let recent = JSON.parse(localStorage.getItem('lulutap_recent') || '[]');
            recent = recent.filter(g => g.id !== game.id);
            recent.unshift(game);
            if (recent.length > 10) recent.pop();
            localStorage.setItem('lulutap_recent', JSON.stringify(recent));

            const params = new URLSearchParams({
                id: game.id, title: game.title, url: game.gameUrl, img: game.img,
                cat: game.category, desc: game.description || '', inst: game.instructions || ''
            });
            window.location.href = `game.html?${params.toString()}`;
        }

        async function loadCategoryData() {
            try {
                const res = await fetch('https://gamemonetize.com/feed.php?format=0&page=1');
                const raw = await res.json();
                rawCategoryGames = raw.map((item, i) => ({
                    id: item.id ? String(item.id) : `cat-${i}`,
                    title: item.title || "Untitled Game",
                    category: item.category || currentCategory,
                    img: item.thumb || '',
                    gameUrl: item.url || '',
                    description: item.description || '',
                    instructions: item.instructions || ''
                })).filter(g => g.category.toLowerCase().includes(currentCategory.toLowerCase()));
            } catch (e) {
                rawCategoryGames = Array.from({length: 30}).map((_, i) => ({
                    id: `mock-cat-${i}`, title: `${currentCategory} Game ${i+1}`, category: currentCategory,
                    img: `https://picsum.photos/seed/${i+100}/300/300`, gameUrl: "https://html5.gamedistribution.com/rvvAS30838184/",
                    description: "Fun game.", instructions: "Use WASD or Space."
                }));
            }

            changeSort('popular');
            setupInfiniteScroll();
        }

        function changeSort(type) {
            sortedGames = [...rawCategoryGames];
            if (type === 'az') {
                sortedGames.sort((a, b) => a.title.localeCompare(b.title));
            } else if (type === 'newest') {
                sortedGames.reverse();
            }
            displayCount = 20;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            const toRender = sortedGames.slice(0, displayCount);
            
            grid.innerHTML = toRender.map(g => `
                <div class="game-card" onclick='saveAndGo(${JSON.stringify(g).replace(/'/g, "&apos;")})'>
                    <div class="card-cover" style="background-image: url('${g.img}');"></div>
                    <div class="card-overlay"><div class="card-title">${g.title}</div></div>
                </div>
            `).join('');

            const trigger = document.getElementById('loading-trigger');
            if (displayCount >= sortedGames.length) {
                trigger.innerText = "No more games in this category.";
            } else {
                trigger.innerText = "Scroll down for more...";
            }
        }

        function setupInfiniteScroll() {
            window.addEventListener('scroll', () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
                    if (displayCount < sortedGames.length) {
                        displayCount += 15;
                        renderGrid();
                    }
                }
            });
        }

        loadCategoryData();
    </script>
</body>
</html>
