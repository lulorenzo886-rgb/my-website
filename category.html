<script>
    // 1. 获取并正确解码 URL 中的分类参数
    const urlParams = new URLSearchParams(window.location.search);
    const rawType = urlParams.get('type') || 'Action';
    const currentCategory = decodeURIComponent(rawType).trim();
    
    let rawCategoryGames = [];

    // 2. 分类 API 地址映射表
    const CATEGORY_API_URLS = {
        ".IO": "https://gamemonetize.com/feed.php?format=0&category=1&page=1",
        "2 Player": "https://gamemonetize.com/feed.php?format=0&category=2&page=1",
        "3D": "https://gamemonetize.com/feed.php?format=0&category=3&page=1",
        "Action": "https://gamemonetize.com/feed.php?format=0&page=1",
        "Adventure": "https://gamemonetize.com/feed.php?format=0&category=4&page=1",
        "Arcade": "https://gamemonetize.com/feed.php?format=0&category=5&page=1",
        "Baby Hazel": "https://gamemonetize.com/feed.php?format=0&category=19&page=1",
        "Bejeweled": "https://gamemonetize.com/feed.php?format=0&category=6&page=1",
        "Boys": "https://gamemonetize.com/feed.php?format=0&category=7&page=1",
        "Clicker": "https://gamemonetize.com/feed.php?format=0&category=8&page=1",
        "Cooking": "https://gamemonetize.com/feed.php?format=0&category=9&page=1",
        "Girls": "https://gamemonetize.com/feed.php?format=0&category=10&page=1",
        "Hypercasual": "https://gamemonetize.com/feed.php?format=0&category=11&page=1",
        "Multiplayer": "https://gamemonetize.com/feed.php?format=0&category=12&page=1",
        "Puzzle": "https://gamemonetize.com/feed.php?format=0&category=13&page=1",
        "Racing": "https://gamemonetize.com/feed.php?format=0&category=14&page=1",
        "Shooting": "https://gamemonetize.com/feed.php?format=0&category=15&page=1",
        "Soccer": "https://gamemonetize.com/feed.php?format=0&category=16&page=1",
        "Sports": "https://gamemonetize.com/feed.php?format=0&category=17&page=1",
        "Stickman": "https://gamemonetize.com/feed.php?format=0&category=18&page=1"
    };

    document.getElementById('bread-cat').innerText = currentCategory;
    document.getElementById('cat-heading').innerText = `${currentCategory} Games`;

    function initLanguage() {
        const savedLang = localStorage.getItem('lulutap_lang') || 'en';
        document.getElementById('lang-select').value = savedLang;
        if (savedLang !== 'en') { setTimeout(() => { doGoogleTranslate(savedLang); }, 1000); }
    }

    function changeLanguage(langCode) {
        localStorage.setItem('lulutap_lang', langCode);
        doGoogleTranslate(langCode);
    }

    function doGoogleTranslate(langCode) {
        const selectEl = document.querySelector('.goog-te-combo');
        if (selectEl) { selectEl.value = langCode; selectEl.dispatchEvent(new Event('change')); }
    }

    function isFavorite(gameId) {
        let favs = JSON.parse(localStorage.getItem('lulutap_favorites') || '[]');
        return favs.some(f => f.id === gameId);
    }

    function toggleFavorite(e, game) {
        e.stopPropagation();
        let favs = JSON.parse(localStorage.getItem('lulutap_favorites') || '[]');
        const index = favs.findIndex(f => f.id === game.id);
        if (index > -1) favs.splice(index, 1);
        else favs.unshift(game);
        localStorage.setItem('lulutap_favorites', JSON.stringify(favs));
        renderGrid();
    }

    function saveAndGo(game) {
        let recent = JSON.parse(localStorage.getItem('lulutap_recent') || '[]');
        recent = recent.filter(g => g.id !== game.id);
        recent.unshift(game);
        if (recent.length > 10) recent.pop();
        localStorage.setItem('lulutap_recent', JSON.stringify(recent));

        const params = new URLSearchParams({
            id: game.id, title: game.title, url: game.gameUrl, img: game.img,
            cat: game.category, desc: game.description || '', inst: game.instructions || ''
        });
        window.location.href = `game.html?${params.toString()}`;
    }

    function changeSort(type) {
        if (type === 'az') {
            rawCategoryGames.sort((a, b) => a.title.localeCompare(b.title));
        } else if (type === 'newest') {
            rawCategoryGames.reverse();
        }
        renderGrid();
    }

    async function loadCategoryData() {
        try {
            // 获取对应的 API，如果没有匹配项，使用通用接口兜底
            const targetUrl = CATEGORY_API_URLS[currentCategory] || 'https://gamemonetize.com/feed.php?format=0&page=1';
            
            const res = await fetch(targetUrl);
            const raw = await res.json();
            
            if (Array.isArray(raw) && raw.length > 0) {
                rawCategoryGames = raw.map((item, i) => ({
                    id: item.id ? String(item.id) : `cat-${i}`,
                    title: item.title || "Untitled Game", 
                    category: currentCategory,
                    img: item.thumb || '', 
                    gameUrl: item.url || '', 
                    description: item.description || '',
                    instructions: item.instructions || ''
                }));
            }
        } catch (e) {
            console.error("Fetch error:", e);
        }
        
        renderGrid();
        initLanguage();
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        if (rawCategoryGames.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #a0aec0;">Loading games or no games available...</div>`;
            return;
        }
        grid.innerHTML = rawCategoryGames.map(g => {
            const isFav = isFavorite(g.id);
            return `
                <div class="game-card" onclick='saveAndGo(${JSON.stringify(g).replace(/'/g, "&apos;")})'>
                    <button class="fav-heart-btn ${isFav ? 'active' : ''}" onclick='toggleFavorite(event, ${JSON.stringify(g).replace(/'/g, "&apos;")})'>
                        ${isFav ? '❤️' : '🤍'}
                    </button>
                    <div class="card-cover" style="background-image: url('${g.img}');"></div>
                    <div class="card-overlay"><div class="card-title">${g.title}</div></div>
                </div>
            `;
        }).join('');
    }

    loadCategoryData();
</script>
