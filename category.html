<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category - LuluTap</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='50%25' cy='50%25' r='50%25'%3E%3Cstop offset='0%25' stop-color='%23141E30'/%3E%3Cstop offset='100%25' stop-color='%23070B12'/%3E%3C/radialGradient%3E%3ClinearGradient id='ring' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300FF87'/%3E%3Cstop offset='100%25' stop-color='%2360EFFF'/%3E%3C/linearGradient%3E%3CradialGradient id='btn' cx='40%25' cy='40%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%2300FF87'/%3E%3Cstop offset='100%25' stop-color='%23005C31'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23bg)'/%3E%3Ccircle cx='256' cy='256' r='180' fill='none' stroke='url(%23ring)' stroke-width='24'/%3E%3Ccircle cx='256' cy='256' r='95' fill='url(%23btn)'/%3E%3Cpath d='M230 200 V290 H300' fill='none' stroke='%23FFFFFF' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #0d1117; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    header { background: #161b22; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #21262d; position: sticky; top: 0; z-index: 1000; }
    .logo { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, #00FF87, #60EFFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .search-container { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 100%; max-width: 420px; }
    .quick-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .tag-pill { background: #21262d; color: #00FF87; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; border: 1px solid #30363d; }
    .search-input { width: 100%; padding: 10px 16px; background: #0d1117; border: 2px solid #30363d; border-radius: 20px; color: #fff; font-size: 14px; outline: none; }

    main { flex: 1; max-width: 1400px; margin: 0 auto; padding: 20px; width: 100%; }
    .cat-title { font-size: 24px; font-weight: 800; margin-bottom: 20px; color: #00FF87; display: flex; align-items: center; justify-content: space-between; }
    .game-count { font-size: 14px; color: #8b949e; font-weight: normal; }
    
    .bento-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); grid-auto-rows: 130px; grid-auto-flow: dense; gap: 12px; }
    .bento-item { position: relative; border-radius: 16px; overflow: hidden; background: #161b22; border: 1px solid #21262d; transition: 0.2s; cursor: pointer; }
    .bento-item:hover { transform: scale(1.03); border-color: #00FF87; z-index: 2; }
    
    .bento-item.size-1x1 { grid-column: span 1; grid-row: span 1; }
    .bento-item.size-2x2 { grid-column: span 2; grid-row: span 2; }
    .bento-item.size-2x1 { grid-column: span 2; grid-row: span 1; }
    .bento-item.size-1x2 { grid-column: span 1; grid-row: span 2; }

    /* Category Navigation Card Inside Grid */
    .bento-item.cat-card-item { background: linear-gradient(135deg, #1f2937, #111827); border: 2px solid #00FF87; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; text-align: center; color: #00FF87; }

    .bento-img { width: 100%; height: 100%; object-fit: cover; }
    .bento-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 5s Simulated Timeline Loader */
    .loader-container { text-align: center; padding: 30px; display: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid #21262d; border-top: 4px solid #00FF87; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    footer { background: #161b22; padding: 24px; text-align: center; border-top: 1px solid #21262d; color: #8b949e; font-size: 13px; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">LuluTap</a>
    <div class="search-container">
      <div class="quick-tags" id="quickTags"></div>
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search games in this category...">
    </div>
  </header>

  <main>
    <div class="cat-title">
      <span id="catTitle">Games</span>
      <span class="game-count" id="gameCount">Loaded: 0</span>
    </div>
    <div class="bento-grid" id="bentoGrid"></div>
    <div class="loader-container" id="loader">
      <div class="spinner"></div>
      <div>Loading more games...</div>
    </div>
  </main>

  <footer>
    <div>© 2026 LuluTap. All rights reserved.</div>
  </footer>

  <script>
    const CATEGORIES = ['Action', '2 Player', '3D', 'Racing', 'Girls', 'Arcade', 'Puzzle', 'Shooting', 'Sports', 'Casual'];
    let currentPage = 1;
    let isLoading = false;
    let currentCategory = '';
    let totalDisplayed = 0;

    function getCategoryFromHash() {
      const hash = decodeURIComponent(location.hash.substring(1)).trim();
      return hash || 'Action';
    }

    function renderQuickTags() {
      const selected = [...CATEGORIES].sort(() => 0.5 - Math.random()).slice(0, 5);
      document.getElementById('quickTags').innerHTML = selected.map(cat => 
        `<a href="category.html#${encodeURIComponent(cat)}" class="tag-pill">🔥 ${cat}</a>`
      ).join('');
    }

    async function loadCategoryGames(page) {
      if (isLoading) return;
      isLoading = true;
      document.getElementById('loader').style.display = 'block';

      try {
        // 请求对应页码的 API 数据
        const response = await fetch(`https://gamemonetize.com/feed.php?format=0&page=${page}`);
        const allGames = await response.json();

        // 核心修复：按当前 URL Hash 的分类进行精确筛选（不区分大小写）
        const filteredGames = allGames.filter(game => {
          if (!game.category) return false;
          return game.category.toLowerCase().includes(currentCategory.toLowerCase());
        });

        // 模拟 5 秒时间线加载等待
        await new Promise(resolve => setTimeout(resolve, 5000));

        if (filteredGames.length > 0) {
          appendBentoItems(filteredGames);
        } else if (page === 1) {
          // 如果第1页根据分类筛选为空，为了页面不白板，展示包含该关键词的游戏或全量前15条
          appendBentoItems(allGames.slice(0, 15));
        }

        currentPage++;
      } catch (err) {
        console.error("API Fetch Error:", err);
      } finally {
        isLoading = false;
        document.getElementById('loader').style.display = 'none';
      }
    }

    function appendBentoItems(games) {
      const grid = document.getElementById('bentoGrid');
      const sizes = ['size-1x1', 'size-1x1', 'size-2x2', 'size-2x1', 'size-1x2'];

      games.forEach((game, index) => {
        const sizeClass = sizes[Math.floor(Math.random() * sizes.length)];
        const card = document.createElement('a');
        card.className = `bento-item ${sizeClass}`;
        card.href = `game.html?id=${encodeURIComponent(game.id)}`;
        card.onclick = () => localStorage.setItem(`game_${game.id}`, JSON.stringify(game));

        card.innerHTML = `
          <img class="bento-img" src="${game.thumb}" alt="${game.title}" loading="lazy">
          <div class="bento-overlay">${game.title}</div>
        `;
        grid.appendChild(card);
        totalDisplayed++;

        // 每渲染约 8 个游戏，穿插一个其他分类的快速卡片
        if ((index + 1) % 8 === 0) {
          const randomCat = CATEGORIES.filter(c => c.toLowerCase() !== currentCategory.toLowerCase())[Math.floor(Math.random() * (CATEGORIES.length - 1))];
          const catCard = document.createElement('a');
          catCard.className = `bento-item size-2x1 cat-card-item`;
          catCard.href = `category.html#${encodeURIComponent(randomCat)}`;
          catCard.innerHTML = `<span>🚀 Explore ${randomCat}</span>`;
          grid.appendChild(catCard);
        }
      });

      document.getElementById('gameCount').innerText = `Games Loaded: ${totalDisplayed}`;
    }

    // 触底加载监听
    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        loadCategoryGames(currentPage);
      }
    });

    // 切换分类 Hash 时刷新页面重新请求
    window.addEventListener('hashchange', () => {
      location.reload();
    });

    // 搜索框筛选
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const items = document.querySelectorAll('#bentoGrid .bento-item:not(.cat-card-item)');
      items.forEach(item => {
        const title = item.querySelector('.bento-overlay')?.innerText.toLowerCase() || '';
        item.style.display = title.includes(query) ? '' : 'none';
      });
    });

    // 初始化
    currentCategory = getCategoryFromHash();
    document.getElementById('catTitle').innerText = `🏷️ ${currentCategory} Games`;
    renderQuickTags();
    loadCategoryGames(1);
  </script>
</body>
</html>
