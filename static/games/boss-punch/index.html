<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annoying Boss Punch Game</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="game-frame" allowfullscreen></iframe>

    <script>
        // 1. 填入截图里的专属游戏 ID 基础链接
        const baseGameUrl = "https://html5.gamedistribution.com/bd9cc9da45b04ee293306209653d8cfb/index.html";
        
        // 2. 动态抓取当前页面地址并进行官方标准编码
        const referrerUrl = encodeURIComponent(window.location.href);
        
        // 3. 按照 GameDistribution 规范自动拼接合规参数
        const finalUrl = `${baseGameUrl}?gd_sdk_referrer_url=${referrerUrl}`;
        
        // 4. 载入游戏
        document.getElementById("game-frame").src = finalUrl;
    </script>
</body>
</html>
