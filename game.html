<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuluTap - Playing Game...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            height: 60px;
            background: #161926;
            border-bottom: 1px solid #262b3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #00f2fe;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background: #222738;
            border: 1px solid #323950;
            color: #a0aec0;
            padding: 6px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #fff;
            border-color: #00f2fe;
        }

        /* Main Section (2-Column Layout) */
        .play-container {
            max-width: 1500px;
            width: 100%;
            margin: 20px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            flex: 1;
        }

        /* Left Column: Game Viewport & Metadata */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .screen-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #262b3d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Bottom Controls Bar inside Game Viewport */
        .controls-bar {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .action-btn {
            background: rgba(22, 25, 38, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: #00f2fe;
            color: #000;
            font-weight: bold;
        }

        /* Game Metadata Box */
        .game-meta-box {
            background: #161926;
            border: 1px solid #262b3d;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .meta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .like-badge {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .tags-row {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: #a0aec0;
        }

        .meta-tag {
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* Right Column: Controls & Info Sidebar */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .side-card {
            background: #161926;
            border: 1px solid #262b3d;
            border-radius: 12px;
            padding: 16px;
        }

        .card-h3 {
            font-size: 14px;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* WASD Layout Preview */
        .keys-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 10px 0;
        }

        .key-row {
            display: flex;
            gap: 6px;
        }

        .key-cap {
            width: 36px;
            height: 36px;
            background: #222738;
            border: 1px solid #323950;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            box-shadow: 0 3px 0 #161926;
        }

        .info-desc {
            font-size: 13px;
            color: #a0aec0;
            line-height: 1.6;
        }

        /* Bottom Section: Seamless Horizontal Marquee */
        .recommend-section {
            max-width: 1500px;
            width: 100%;
            margin: 0 auto 30px auto;
            padding: 0 24px;
        }

        .rec-header {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 12px;
        }

        .marquee-wrapper {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: #161926;
            border-radius: 12px;
            border: 1px solid #262b3d;
            padding: 16px 0;
        }

        .marquee-track {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: scrollMarquee 25s linear infinite;
        }

        .marquee-track:hover {
            animation-play-state: paused;
        }

        .rec-card {
            width: 140px;
            height: 140px;
            background: #222738;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            text-decoration: none;
            flex-shrink: 0;
            border: 1px solid #323950;
        }

        .rec-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rec-card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 17, 26, 0.85);
            color: #fff;
            font-size: 11px;
            padding: 6px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .play-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="logo">🕹️ LuluTap</a>
        <a href="index.html" class="back-btn">🏠 Home</a>
    </header>

    <!-- Main Game Container -->
    <div class="play-container">
        
        <!-- Left Panel: Game Screen and Metadata -->
        <div class="left-panel">
            <div class="screen-box" id="screen-box">
                <!-- Game Frame -->
                <iframe class="game-iframe" id="game-frame" allowfullscreen src="about:blank"></iframe>
                
                <!-- Screen Controls -->
                <div class="controls-bar">
                    <button class="action-btn" onclick="reloadGame()">🔄 Reload</button>
                    <button class="action-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
                </div>
            </div>

            <!-- Title & Tags -->
            <div class="game-meta-box">
                <div class="meta-header">
                    <h1 class="game-title" id="game-title">Loading...</h1>
                    <span class="like-badge" id="game-likes">👍 2.8k</span>
                </div>
                <div class="tags-row">
                    <span>🏷️ Categories & Tags:</span>
                    <span id="game-tags">
                        <span class="meta-tag">HTML5</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Right Panel: Controls & Description -->
        <div class="right-panel">
            <div class="side-card">
                <div class="card-h3">🎮 CONTROLS</div>
                <div class="keys-layout">
                    <div class="key-cap">W</div>
                    <div class="key-row">
                        <div class="key-cap">A</div>
                        <div class="key-cap">S</div>
                        <div class="key-cap">D</div>
                    </div>
                </div>
            </div>

            <div class="side-card">
                <div class="card-h3">📖 GAME INFO</div>
                <p class="info-desc" id="game-desc">
                    Use Arrow keys or WASD to control movement. Click the fullscreen button for an immersive gaming experience.
                </p>
            </div>
        </div>
    </div>

    <!-- Bottom Section: Recommended Games Marquee -->
    <section class="recommend-section">
        <div class="rec-header">🔥 SIMILAR GAMES</div>
        <div class="marquee-wrapper">
            <div class="marquee-track" id="marquee-track">
                <!-- Marquee cards rendered dynamically via JS -->
            </div>
        </div>
    </section>

    <script>
        // 1. Get URL parameters (Supports directly passed URL or Title)
        const urlParams = new URLSearchParams(window.location.search);
        const gameUrl = urlParams.get('url');
        const gameTitle = urlParams.get('title') || 'Awesome HTML5 Game';

        const frame = document.getElementById('game-frame');
        const titleEl = document.getElementById('game-title');

        if (gameUrl) {
            frame.src = decodeURIComponent(gameUrl);
            titleEl.textContent = decodeURIComponent(gameTitle);
        } else {
            // Fallback for testing without URL parameters
            titleEl.textContent = "Demo Game (No link detected)";
            frame.src = "https://gamemonetize.com/feed.php"; 
        }

        // 2. Reload Game
        function reloadGame() {
            frame.src = frame.src;
        }

        // 3. Fullscreen Toggle
        function toggleFullscreen() {
            const screenBox = document.getElementById('screen-box');
            if (!document.fullscreenElement) {
                if (screenBox.requestFullscreen) {
                    screenBox.requestFullscreen();
                } else if (screenBox.webkitRequestFullscreen) {
                    screenBox.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 4. Render Endless Marquee Cards
        async function loadRecommendations() {
            const track = document.getElementById('marquee-track');
            
            try {
                // Fetch recommended games from API
                const res = await fetch('https://gamemonetize.com/feed.php?format=0&page=1');
                const data = await res.json();
                const list = data.slice(0, 10);

                const cardsHTML = list.map(item => `
                    <a href="game.html?url=${encodeURIComponent(item.url)}&title=${encodeURIComponent(item.title)}" class="rec-card">
                        <img src="${item.thumb}" alt="${item.title}">
                        <div class="rec-card-title">${item.title}</div>
                    </a>
                `).join('');

                // Duplicate cards array to achieve seamless infinite loop
                track.innerHTML = cardsHTML + cardsHTML;
            } catch(e) {
                // Fallback static cards when network fails
                let fallback = '';
                for(let i=1; i<=10; i++) {
                    fallback += `
                        <div class="rec-card">
                            <img src="https://picsum.photos/200/200?random=${i}">
                            <div class="rec-card-title">Recommended ${i}</div>
                        </div>
                    `;
                }
                track.innerHTML = fallback + fallback;
            }
        }

        // Initialize recommendations on window load
        window.addEventListener('DOMContentLoaded', loadRecommendations);
    </script>
</body>
</html>
