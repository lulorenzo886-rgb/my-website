<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ game.title }} - {{ t.site_title }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #12131C;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header-bar {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background-color: #252836;
            color: #fff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #3B3E52;
            transition: 0.2s;
        }
        .back-btn:hover {
            background-color: #5A49E3;
        }
        .game-wrapper {
            width: 100%;
            max-width: 1100px;
            height: 650px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2B2D3E;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .details-card {
            width: 100%;
            max-width: 1100px;
            background-color: #1A1C29;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
            border: 1px solid #2B2D3E;
        }
        .details-card h2 {
            color: #6C5CE7;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .details-card p {
            color: #A0A5BA;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>{{ game.title }}</h1>
        <a href="/{{ current_lang }}/" class="back-btn">{{ t.back_home }}</a>
    </div>

    <div class="game-wrapper">
        <!-- 如果是 GD 平台的嵌入游戏 (数据库存了 game_id) -->
        {% if game.game_id %}
            <iframe id="gd-frame" allowfullscreen></iframe>
            <script>
                (function() {
                    const gameId = "{{ game.game_id }}";
                    const currentUrl = encodeURIComponent(window.location.href);
                    const finalUrl = `https://html5.gamedistribution.com/${gameId}/?gd_sdk_referrer_url=${currentUrl}`;
                    document.getElementById('gd-frame').src = finalUrl;
                })();
            </script>
        {% else %}
            <!-- 如果是本地项目静态文件夹里的游戏 -->
            <iframe src="{{ url_for('static', filename='games/' + game.slug + '/index.html') }}" allowfullscreen></iframe>
        {% endif %}
    </div>

    <div class="details-card">
        <h2>{{ t.game_intro }}</h2>
        <p>{{ game.description }}</p>
        
        <h2>{{ t.game_controls }}</h2>
        <p>{{ game.controls }}</p>
    </div>

</body>
</html>
