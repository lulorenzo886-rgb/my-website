<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Game - LuluTap</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CradialGradient id='bg' cx='50%25' cy='50%25' r='50%25'%3E%3Cstop offset='0%25' stop-color='%23141E30'/%3E%3Cstop offset='100%25' stop-color='%23070B12'/%3E%3C/radialGradient%3E%3ClinearGradient id='ring' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300FF87'/%3E%3Cstop offset='100%25' stop-color='%2360EFFF'/%3E%3C/linearGradient%3E%3CradialGradient id='btn' cx='40%25' cy='40%25' r='60%25'%3E%3Cstop offset='0%25' stop-color='%2300FF87'/%3E%3Cstop offset='100%25' stop-color='%23005C31'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='100' fill='url(%23bg)'/%3E%3Ccircle cx='256' cy='256' r='180' fill='none' stroke='url(%23ring)' stroke-width='24'/%3E%3Ccircle cx='256' cy='256' r='95' fill='url(%23btn)'/%3E%3Cpath d='M230 200 V290 H300' fill='none' stroke='%23FFFFFF' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #0d1117; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    header { background: #161b22; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #21262d; position: sticky; top: 0; z-index: 1000; }
    .logo { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, #00FF87, #60EFFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .search-container { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: 100%; max-width: 420px; }
    .quick-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .tag-pill { background: #21262d; color: #00FF87; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; border: 1px solid #30363d; }
    .search-input { width: 100%; padding: 10px 16px; background: #0d1117; border: 2px solid #30363d; border-radius: 20px; color: #fff; font-size: 14px; outline: none; }

    /* 80 / 20 GOLDEN RATIO PLAY AREA */
    .play-layout { display: flex; gap: 16px; max-width: 1500px; margin: 20px auto; padding: 0 20px; width: 100%; }
    .game-window-box { flex: 0 0 78%; display: flex; flex-direction: column; gap: 12px; }
    .iframe-wrapper { position: relative; width: 100%; padding-top: 56.25%; /* 16:9 Aspect Ratio */ background: #000; border-radius: 16px; overflow: hidden; border: 2px solid #21262d; }
    .iframe-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .game-info-bar { background: #161b22; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700; border: 1px solid #21262d; }

    /* 20% COMPACT SIDEBAR */
    .sidebar { flex: 0 0 22%; background: #161b22; border-radius: 16px; padding: 16px; border: 1px solid #21262d; display: flex; flex-direction: column; gap: 16px; height: fit-content; }
    .side-section-title { font-size: 14px; font-weight: 700; color: #00FF87; border-bottom: 1px solid #30363d; padding-bottom: 6px; }
    
    .desc-text { font-size: 12px; color: #8b949e; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .desc-text.expanded { -webkit-line-clamp: unset; }
    .toggle-btn { font-size: 11px; color: #60EFFF; cursor: pointer; margin-top: 4px; font-weight: 600; }

    /* SIMULATED KEYCAPS & MOUSE UI */
    .controls-box { display: flex; flex-direction: column; gap: 10px; }
    .keycap-group { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #c9d1d9; }
    .keycap { background: #21262d; border: 1px solid #484f58; border-bottom: 3px solid #30363d; border-radius: 6px; padding: 3px 8px; font-weight: 800; font-family: monospace; color: #00FF87; font-size: 12px; }
    
    .mouse-icon { width: 20px; height: 30px; border: 2px solid #8b949e; border-radius: 10px; position: relative; }
    .mouse-icon.left-click::before { content: ''; position: absolute; top: 2px; left: 2px; width: 6px; height: 10px; background: #00FF87; border-top-left-radius: 6px; }

    /* RANDOM 30 SIMILAR GAMES BENTO GRID */
    .recommended-section { max-width: 1500px; margin: 30px auto; padding: 0 20px; width: 100%; }
    .bento-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); grid-auto-rows: 130px; grid-auto-flow: dense; gap: 12px; }
    .bento-item { position: relative; border-radius: 16px; overflow: hidden; background: #161b22; border: 1px solid #21262d; transition: 0.2s; cursor: pointer; }
    .bento-item:hover { transform: scale(1.03); border-color: #00FF87; }
    .bento-item.size-1x1 { grid-column: span 1; grid-row: span 1; }
    .bento-item.size-2x2 { grid-column: span 2; grid-row: span 2; }
    .bento-item.size-2x1 { grid-column: span 2; grid-row: span 1; }
    .bento-item.size-1x2 { grid-column: span 1; grid-row: span 2; }
    .bento-img { width: 100%; height: 100%; object-fit: cover; }
    .bento-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    footer { background: #161b22; padding: 24px; text-align: center; border-top: 1px solid #21262d; color: #8b949e; font-size: 13px; margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">LuluTap</a>
    <div class="search-container">
      <div class="quick-tags" id="quickTags"></div>
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search games or tags...">
    </div>
  </header>

  <div class="play-layout">
    <!-- 80% GOLDEN WINDOW -->
    <div class="game-window-box">
      <div class="iframe-wrapper">
        <iframe id="gameIframe" src="about:blank" allowfullscreen="true"></iframe>
      </div>
      <div class="game-info-bar" id="gameTitle">Loading Game...</div>
    </div>

    <!-- 20% SIDEBAR -->
    <div class="sidebar">
      <div>
        <div class="side-section-title">📜 ABOUT GAME</div>
        <div class="desc-text" id="gameDesc">No description available.</div>
        <div class="toggle-btn" id="toggleDescBtn" onclick="toggleDesc()">▼ Read More</div>
      </div>

      <div>
        <div class="side-section-title">🎮 CONTROLS</div>
        <div class="controls-box" id="controlsBox">
          <div class="keycap-group"><span class="keycap">W A S D</span> Movement</div>
          <div class="keycap-group"><span class="keycap">Space</span> Action</div>
          <div class="keycap-group"><div class="mouse-icon left-click"></div> Left Click</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RANDOM 30 SIMILAR GAMES -->
  <div class="recommended-section">
    <div class="side-section-title" style="font-size: 18px; margin-bottom: 16px;">🔥 More Games You Might Like</div>
    <div class="bento-grid" id="recommendGrid"></div>
  </div>

  <footer>
    <div>© 2026 LuluTap. All rights reserved.</div>
  </footer>

  <script>
    const CATEGORIES = ['Action', '2 Player', '3D', 'Racing', 'Girls', 'Arcade', 'Puzzle', 'Shooting', 'Sports', 'Casual'];

    function renderQuickTags() {
      const selected = [...CATEGORIES].sort(() => 0.5 - Math.random()).slice(0, 5);
      document.getElementById('quickTags').innerHTML = selected.map(cat => 
        `<a href="category.html#${encodeURIComponent(cat)}" class="tag-pill">🔥 ${cat}</a>`
      ).join('');
    }

    function toggleDesc() {
      const desc = document.getElementById('gameDesc');
      const btn = document.getElementById('toggleDescBtn');
      desc.classList.toggle('expanded');
      btn.innerText = desc.classList.contains('expanded') ? '▲ Show Less' : '▼ Read More';
    }

    // Load Game Details
    function initGame() {
      const urlParams = new URLSearchParams(window.location.search);
      const gameId = urlParams.get('id');
      const cachedData = localStorage.getItem(`game_${gameId}`);

      if (cachedData) {
        const game = JSON.parse(cachedData);
        document.getElementById('gameIframe').src = game.url;
        document.getElementById('gameTitle').innerText = `🕹️ ${game.title}  |  Category: ${game.category || 'General'}`;
        if (game.description) document.getElementById('gameDesc').innerText = game.description;
      } else {
        document.getElementById('gameTitle').innerText = "🕹️ Featured Online Game";
      }
    }

    // Load 30 Random Games in Bento Grid
    async function load30RandomGames() {
      try {
        const response = await fetch('https://gamemonetize.com/feed.php?format=0&page=1');
        const games = await response.json();
        
        // Randomly pick 30 games
        const shuffled = [...games].sort(() => 0.5 - Math.random()).slice(0, 30);
        const grid = document.getElementById('recommendGrid');
        const sizes = ['size-1x1', 'size-1x1', 'size-2x2', 'size-2x1', 'size-1x2'];

        shuffled.forEach(game => {
          const sizeClass = sizes[Math.floor(Math.random() * sizes.length)];
          const card = document.createElement('a');
          card.className = `bento-item ${sizeClass}`;
          card.href = `game.html?id=${encodeURIComponent(game.id)}`;
          card.onclick = () => localStorage.setItem(`game_${game.id}`, JSON.stringify(game));

          card.innerHTML = `
            <img class="bento-img" src="${game.thumb}" alt="${game.title}" loading="lazy">
            <div class="bento-overlay">${game.title}</div>
          `;
          grid.appendChild(card);
        });
      } catch (err) { console.error(err); }
    }

    renderQuickTags();
    initGame();
    load30RandomGames();
  </script>
</body>
</html>
