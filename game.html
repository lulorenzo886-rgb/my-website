<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game - LuluTap</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f111a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { height: 64px; background: #161926; border-bottom: 1px solid #262b3d; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: #00f2fe; text-decoration: none; }

        .lang-selector { background: #0f111a; border: 1px solid #2a3148; color: #fff; padding: 6px 12px; border-radius: 16px; font-size: 12px; outline: none; cursor: pointer; }

        .game-page-container { max-width: 1500px; width: 100%; margin: 0 auto; padding: 20px 24px 40px 24px; flex: 1; }
        
        /* Top Action Bar */
        .game-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .game-top-left { display: flex; align-items: center; gap: 12px; }
        .game-main-title { font-size: 22px; font-weight: 800; }
        .game-category-badge { background: rgba(0, 242, 254, 0.15); color: #00f2fe; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; }

        .action-btns { display: flex; align-items: center; gap: 10px; }
        .action-btn { background: #161926; border: 1px solid #262b3d; color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: border-color 0.2s, background 0.2s; }
        .action-btn:hover { border-color: #00f2fe; }
        .action-btn.active { border-color: #ff0844; color: #ff0844; }

        /* Social Rating System */
        .rating-box { display: flex; align-items: center; gap: 8px; background: #161926; border: 1px solid #262b3d; padding: 6px 12px; border-radius: 20px; font-size: 12px; }
        .rating-score { color: #00f2fe; font-weight: bold; }

        /* Dual Column Layout */
        .hero-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 40px; }
        .iframe-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #222738; }
        .iframe-container iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; }

        .sidebar-card { background: #161926; border: 1px solid #222738; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 16px; height: fit-content; }
        .section-label { font-size: 14px; font-weight: 700; color: #00f2fe; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .toggle-btn { background: none; border: none; color: #a0aec0; font-size: 12px; cursor: pointer; }
        .desc-text { font-size: 13px; color: #cbd5e0; line-height: 1.5; max-height: 200px; overflow-y: auto; }

        .controls-box { background: #0f111a; border: 1px solid #262b3d; border-radius: 8px; padding: 12px; }
        .key-badge { display: inline-block; background: #222738; border: 1px solid #3a4460; border-bottom: 3px solid #00f2fe; color: #fff; padding: 3px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; font-weight: bold; margin: 2px 4px; }
        .control-item { font-size: 13px; color: #a0aec0; line-height: 1.6; }

        .recommend-section { margin-top: 32px; }
        .row-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
        .row-scroll-track { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
        .game-card { width: 160px; height: 160px; flex-shrink: 0; position: relative; background: #161926; border-radius: 12px; overflow: hidden; border: 1px solid #222738; text-decoration: none; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer; }
        .card-cover { position: absolute; top:0; left:0; width:100%; height:100%; background-size: cover; background-position: center; }
        .card-overlay { position: relative; z-index: 1; background: linear-gradient(0deg, rgba(15,17,26,0.95) 0%, rgba(15,17,26,0) 100%); padding: 10px; }
        .card-title { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        footer { background: #161926; border-top: 1px solid #262b3d; padding: 32px 24px; text-align: center; margin-top: auto; }
        .footer-links { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
        .footer-link { color: #a0aec0; text-decoration: none; font-size: 13px; }
        .footer-copyright { font-size: 12px; color: #718096; }

        #google_translate_element { display: none; }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }

        @media (max-width: 1024px) { .hero-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">LuluTap</a>
        <select class="lang-selector" id="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">🇺🇸 English</option>
            <option value="zh-CN">🇨🇳 简体中文</option>
            <option value="es">🇪🇸 Español</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="ar">🇸🇦 العربية</option>
            <option value="pt">🇧🇷 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="ja">🇯🇵 日本語</option>
        </select>
    </header>

    <div id="google_translate_element"></div>

    <main class="game-page-container">
        <div class="game-top-bar">
            <div class="game-top-left">
                <h1 class="game-main-title" id="game-title">Loading...</h1>
                <a href="#" class="game-category-badge" id="game-cat">Category</a>
            </div>

            <div class="action-btns">
                <!-- Thumbs Rating System -->
                <div class="rating-box">
                    <button style="background:none;border:none;cursor:pointer;" onclick="vote(true)">👍</button>
                    <span class="rating-score" id="rating-score">96%</span>
                    <button style="background:none;border:none;cursor:pointer;" onclick="vote(false)">👎</button>
                </div>

                <!-- Favorite Heart Button -->
                <button class="action-btn" id="fav-btn" onclick="toggleFavoriteCurrent()">
                    <span id="fav-icon">🤍</span> Favorite
                </button>

                <!-- Social Share Button -->
                <button class="action-btn" onclick="shareGame()">🔗 Share</button>
            </div>
        </div>

        <div class="hero-layout">
            <div class="iframe-container" id="iframe-box">
                <iframe id="game-iframe" src="" allowfullscreen></iframe>
            </div>

            <div class="sidebar-card">
                <div>
                    <div class="section-label">
                        <span>📖 Description</span>
                        <button class="toggle-btn" onclick="toggleDesc()" id="toggle-btn">Fold</button>
                    </div>
                    <div class="desc-text" id="desc-text">Game description loading...</div>
                </div>

                <div>
                    <div class="section-label">🎮 Controls / How to Play</div>
                    <div class="controls-box" id="controls-box">Loading controls...</div>
                </div>
            </div>
        </div>

        <div class="recommend-section">
            <div class="row-title" id="related-row-title">🎲 More Related Games</div>
            <div class="row-scroll-track" id="related-track"></div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="privacy.html" class="footer-link">Privacy Policy</a>
            <a href="terms.html" class="footer-link">Terms of Service</a>
            <a href="dmca.html" class="footer-link">DMCA Policy</a>
            <a href="contact.html" class="footer-link">Contact Us</a>
        </div>
        <div class="footer-copyright">© 2026 LuluTap. All rights reserved.</div>
    </footer>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gameData = {
            id: params.get('id') || '0',
            title: params.get('title') || 'Online Game',
            url: params.get('url') || '',
            cat: params.get('cat') || 'Casual',
            desc: params.get('desc') || 'Enjoy playing on LuluTap!',
            inst: params.get('inst') || 'WASD / Space bar / Click to play'
        };

        document.getElementById('game-title').innerText = gameData.title;
        document.getElementById('game-cat').innerText = gameData.cat;
        document.getElementById('game-cat').href = `category.html?type=${encodeURIComponent(gameData.cat)}`;
        document.getElementById('game-iframe').src = gameData.url;
        document.getElementById('desc-text').innerText = gameData.desc;

        // Auto Mute/Pause Guard on Tab Switch
        window.addEventListener('blur', () => {
            const iframe = document.getElementById('game-iframe');
            iframe.style.opacity = '0.3';
        });
        window.addEventListener('focus', () => {
            const iframe = document.getElementById('game-iframe');
            iframe.style.opacity = '1';
        });

        function initLanguage() {
            const savedLang = localStorage.getItem('lulutap_lang') || 'en';
            document.getElementById('lang-select').value = savedLang;
            if (savedLang !== 'en') { setTimeout(() => { doGoogleTranslate(savedLang); }, 1000); }
        }

        function changeLanguage(langCode) {
            localStorage.setItem('lulutap_lang', langCode);
            doGoogleTranslate(langCode);
        }

        function doGoogleTranslate(langCode) {
            const selectEl = document.querySelector('.goog-te-combo');
            if (selectEl) { selectEl.value = langCode; selectEl.dispatchEvent(new Event('change')); }
        }

        function updateFavBtnState() {
            let favs = JSON.parse(localStorage.getItem('lulutap_favorites') || '[]');
            const isFav = favs.some(f => f.id === gameData.id);
            const btn = document.getElementById('fav-btn');
            const icon = document.getElementById('fav-icon');
            if(isFav) {
                btn.classList.add('active');
                icon.innerText = '❤️';
            } else {
                btn.classList.remove('active');
                icon.innerText = '🤍';
            }
        }

        function toggleFavoriteCurrent() {
            let favs = JSON.parse(localStorage.getItem('lulutap_favorites') || '[]');
            const index = favs.findIndex(f => f.id === gameData.id);
            if (index > -1) favs.splice(index, 1);
            else favs.unshift(gameData);
            localStorage.setItem('lulutap_favorites', JSON.stringify(favs));
            updateFavBtnState();
        }

        function vote(isUp) {
            alert(isUp ? "Thanks for liking this game!" : "Feedback recorded!");
        }

        function shareGame() {
            if (navigator.share) {
                navigator.share({
                    title: gameData.title,
                    text: `Play ${gameData.title} free on LuluTap!`,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Game link copied to clipboard!");
            }
        }

        function parseControls(instText) {
            const box = document.getElementById('controls-box');
            let parsedHtml = instText;
            const keyRules = [
                { regex: /\b(WASD|W\/A\/S\/D)\b/gi, tag: '<span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span>' },
                { regex: /\b(Arrow Keys|Arrows)\b/gi, tag: '<span class="key-badge">↑</span><span class="key-badge">↓</span><span class="key-badge">←</span><span class="key-badge">→</span>' },
                { regex: /\b(Spacebar|Space)\b/gi, tag: '<span class="key-badge">Space</span>' },
                { regex: /\b(Click|Tap)\b/gi, tag: '<span class="key-badge">🖱️ Mouse</span>' }
            ];
            keyRules.forEach(rule => { parsedHtml = parsedHtml.replace(rule.regex, rule.tag); });
            box.innerHTML = `<div class="control-item">${parsedHtml}</div>`;
        }

        async function loadRecommendations() {
            let all = [];
            try {
                const res = await fetch('https://gamemonetize.com/feed.php?format=0&page=1');
                const raw = await res.json();
                all = raw.map((item, i) => ({
                    id: item.id ? String(item.id) : `rec-${i}`,
                    title: item.title || "Untitled", category: item.category || "Casual",
                    img: item.thumb || '', gameUrl: item.url || ''
                }));
            } catch (e) {
                all = Array.from({length: 10}).map((_, i) => ({
                    id: `rec-${i}`, title: `Game ${i+1}`, category: gameData.cat,
                    img: `https://picsum.photos/seed/${i+80}/300/300`, gameUrl: "https://html5.gamedistribution.com/rvvAS30838184/"
                }));
            }

            const track = document.getElementById('related-track');
            track.innerHTML = all.slice(0, 10).map(g => `
                <div class="game-card" onclick='location.href="game.html?id=${g.id}&title=${encodeURIComponent(g.title)}&url=${encodeURIComponent(g.gameUrl)}&img=${encodeURIComponent(g.img)}&cat=${encodeURIComponent(g.category)}"'>
                    <div class="card-cover" style="background-image: url('${g.img}');"></div>
                    <div class="card-overlay"><div class="card-title">${g.title}</div></div>
                </div>
            `).join('');

            updateFavBtnState();
            parseControls(gameData.inst);
            initLanguage();
        }

        loadRecommendations();
    </script>
</body>
</html>
